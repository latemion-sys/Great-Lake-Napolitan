<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex">
<title>모든 것을 뚫는 푸른 고래 · 5단계 이펙트 미리보기</title>
<link rel="stylesheet" href="./pallid-cinematic-v2.css?v=01513">
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
body{background:radial-gradient(ellipse at 45% 0%,#1f3447,#0b131e 49%,#070a12 100%);font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif;color:#e7eef3;line-height:1.65;margin:0}
main{max-width:1110px;margin:auto;padding:36px 18px 72px}
h1{font-size:29px;letter-spacing:-.04em;margin:6px 0 8px}
p{margin:5px 0 15px}.eyebrow{font-size:12px;letter-spacing:.18em;color:#a9c9dc}
.subtitle{color:#b1c2d0;font-size:14px}
.tabs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin:23px 0 12px}
button{font:inherit;cursor:pointer;font-size:13px;line-height:1.5;background:#15243a;color:#b8cddc;padding:12px;border:1px solid #3c5470;border-radius:10px}
button:hover{background:#233c58}
button:focus-visible{outline:3px solid #9fd2ef;outline-offset:2px}
.tabs button[aria-pressed="true"]{color:#f6fbff;background:#24506e;border-color:#8fcbea;box-shadow:inset 0 -3px #6fb7dd}
.viewer{background:linear-gradient(120deg,#152536,#111c2a);border:1px solid #415a72;border-radius:17px;padding:19px;box-shadow:0 24px 70px #0005}
#stage .pallid-cine-v2{margin:0;height:clamp(270px,47vw,485px);border-color:#6f8ea6}
.controls{display:flex;justify-content:space-between;align-items:center;gap:13px;margin-top:15px;flex-wrap:wrap}
.meta h2{font-size:19px;letter-spacing:-.03em;margin:0 0 2px}
.meta p{font-size:13px;color:#a0b7c7;margin:0}
.actions{display:flex;gap:7px}
.actions button{padding:9px 14px;white-space:nowrap}
.actions .primary{background:#2c5b7a;color:white;border-color:#73a9c9}
.help{margin-top:16px;font-size:12px;color:#8ea6b8}
.load-error{padding:20px;color:#ffcbc4;background:#421c24;border:1px solid #a94d57;border-radius:12px}
@media(max-width:650px){main{padding:21px 11px 50px}.tabs{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.tabs button{padding:8px 5px;font-size:11px}.viewer{padding:10px}.actions button{font-size:12px}h1{font-size:23px}#stage .pallid-cine-v2{height:clamp(200px,60vw,275px)}}
</style>
</head>
<body>
<main>
<div class="eyebrow">대호수 · 모든 것을 뚫는 푸른 고래 · 시네마틱</div>
<h1>사냥 이펙트 실시간 미리보기</h1>
<p class="subtitle">다섯 장면을 골라 보고, 멈추거나 처음부터 다시 재생할 수 있습니다. 실제 게임에서는 조우와 전투 진행에 맞춰 자동으로 바뀝니다.</p>
<nav class="tabs" id="scene-tabs" aria-label="장면 선택">
<button type="button" data-stage="0" aria-pressed="true">1 · 수면의 절단</button>
<button type="button" data-stage="1" aria-pressed="false">2 · 초고속 관통</button>
<button type="button" data-stage="2" aria-pressed="false">3 · 푸른 항로 추적</button>
<button type="button" data-stage="3" aria-pressed="false">4 · 관통 회피</button>
<button type="button" data-stage="4" aria-pressed="false">5 · 최후의 교차</button>
</nav>
<section class="viewer" aria-label="이펙트 영상">
<div id="stage" aria-live="off"></div>
<div class="controls">
<div class="meta"><h2 id="scene-title">수면의 절단</h2><p id="scene-desc"></p></div>
<div class="actions">
<button class="primary" id="replay" type="button">처음부터 재생 ↻</button>
<button id="pause" type="button" aria-pressed="false">일시 정지</button>
</div>
</div>
</section>
<p class="help">1~4단계는 반복 재생되고, 5단계(사냥 성공)는 한 번 재생된 뒤 마지막 장면에 멈춥니다. 게임에서는 조우 → 전투 1·2·3번째 공격 → 사냥 성공 순서로 나옵니다.</p>
</main>
<script src="./blue-whale-v3.js?v=bw1030"></script>
<script src="./blue-whale-v3-scenes.js?v=bw1030"></script>
<script>
(function(){
'use strict';
var lib=window.BlueWhaleV3,stage=document.getElementById('stage'),title=document.getElementById('scene-title'),desc=document.getElementById('scene-desc'),pause=document.getElementById('pause');
var DESC=['푸른 몸이 보이기도 전에 지느러미가 수면을 먼저 갈라 놓습니다.','물속에서 솟구친 고래가 배 앞을 순식간에 가로지릅니다.','고래가 남긴 빛나는 물길을 따라 배가 전속력으로 쫓습니다.','고래가 배를 꿰뚫으려는 순간 배를 틀어 피합니다.','작살을 먼저 던져 두고, 고래가 그 지점을 지나가는 순간 사냥을 끝냅니다.'];
var active=0,playing=true;
function display(i){
 active=i;stage.innerHTML=lib.html(i);
 stage.classList.toggle('is-paused',!playing);
 title.textContent=lib.stages[i];desc.textContent=DESC[i];
 document.querySelectorAll('#scene-tabs [data-stage]').forEach(function(b){b.setAttribute('aria-pressed',String(+b.dataset.stage===i));});
}
if(!lib){stage.innerHTML='<div class="load-error">애니메이션 파일을 불러오지 못했습니다. 새로고침해 주세요.</div>';return;}
document.getElementById('scene-tabs').addEventListener('click',function(e){var b=e.target.closest('[data-stage]');if(b){lib.replayToken++;display(+b.dataset.stage);}});
document.getElementById('replay').addEventListener('click',function(){lib.replayToken++;playing=true;pause.textContent='일시 정지';pause.setAttribute('aria-pressed','false');display(active);});
pause.addEventListener('click',function(){playing=!playing;stage.classList.toggle('is-paused',!playing);pause.textContent=playing?'일시 정지':'계속 재생';pause.setAttribute('aria-pressed',String(!playing));});
display(0);
})();
</script>
</body>
</html>
