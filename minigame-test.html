<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>대호수 · 미니게임 테스트</title>
<style>body{margin:0;background:#0d1117;color:#e8edf3;font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh}</style>
</head>
<body>
<p id="loading">테스트 환경을 불러오는 중…</p>
<script>
/* 미니게임 테스트 페이지
   - 실제 게임(index.html)을 그대로 불러와 쓰므로 게임이 바뀌면 이 페이지도 자동으로 최신이 된다.
   - 저장소를 메모리로 바꿔 진짜 저장 데이터·업적에는 손대지 않는다(새로고침하면 초기화).
   - 위쪽 테스트 막대에서 창백한 고래·푸른 고래 미니게임으로 바로 들어간다. */
(function(){
'use strict';
var SHIM=[
'<script>',
'(function(){',
' function MemStore(){var d={};return {getItem:function(k){return Object.prototype.hasOwnProperty.call(d,k)?d[k]:null;},',
'  setItem:function(k,v){d[k]=String(v);},removeItem:function(k){delete d[k];},clear:function(){d={};},',
'  key:function(i){return Object.keys(d)[i]||null;},get length(){return Object.keys(d).length;}};}',
' try{Object.defineProperty(window,"localStorage",{value:MemStore(),configurable:true});}catch(e){}',
' try{Object.defineProperty(window,"sessionStorage",{value:MemStore(),configurable:true});}catch(e){}',
' window.__MINIGAME_TEST__=true;',
'})();',
'<\/script>'
].join('\n');

var TOOLBAR=[
'<style>',
'#mgt{position:sticky;top:0;z-index:9999;background:#10161dee;backdrop-filter:blur(6px);border-bottom:1px solid #4a5a6a;padding:10px 14px;font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif;color:#e8edf3}',
'#mgt .row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;max-width:1180px;margin:auto}',
'#mgt b{color:#ffcf9a;font-size:13px;margin-right:6px}',
'#mgt button{background:#283544;color:#e8edf3;border:1px solid #4f6378;border-radius:9px;padding:7px 11px;font:inherit;font-size:12px;cursor:pointer}',
'#mgt button:hover{background:#354d64}#mgt button.on{background:#5a3f22;border-color:#ffcf9a;color:#fff1d8}',
'#mgt label{font-size:12px;color:#c4d0dc;display:flex;gap:5px;align-items:center;margin-left:6px}',
'#mgt .note{font-size:11px;color:#8fa0b0;max-width:1180px;margin:6px auto 0}',
'@media(max-width:620px){#mgt{padding:8px 10px}#mgt button{padding:6px 8px;font-size:11px}}',
'</style>',
'<div id="mgt"><div class="row">',
'<b>미니게임 테스트</b>',
'<button type="button" data-t="pEnc">0단계 · 조우(망 선택)</button>',
'<button type="button" data-t="shell">1단계 · 외피에 작살</button>',
'<button type="button" data-t="lure">1단계 · 상처에 작살(입 벌리기)</button>',
'<button type="button" data-t="acid">3단계 · 위산 통과</button>',
'<button type="button" data-t="heart">5단계 · 심장 파괴</button>',
'</div><div class="row" style="margin-top:6px">',
'<b style="color:#8fd6ff">푸른 고래</b>',
'<button type="button" data-t="bEnc">1단계 · 조우</button>',
'<button type="button" data-t="bPierce">2단계 · 초고속 관통</button>',
'<button type="button" data-t="bMer">꿰뚫린 것들</button>',
'<button type="button" data-t="bChase">3단계 · 추적</button>',
'<button type="button" data-t="bEvade">4단계 · 관통 회피</button>',
'<button type="button" data-t="bFinal">5단계 · 최후의 교차</button>',
'<button type="button" data-t="bFinalBlind">5단계 · 궤적 2줄(겨눌 곳 없음)</button>',
'</div><div class="row" style="margin-top:6px">',
'<b style="color:#ff9a8a">붉은 고래</b>',
'<button type="button" data-t="rEnc">1단계 · 조우</button>',
'<button type="button" data-t="rMash">2단계 · 팔 떨쳐내기</button>',
'<button type="button" data-t="rParry">3단계 · 여덟 팔 격퇴</button>',
'<button type="button" data-t="rHead">4단계 · 붉은 등(동전)</button>',
'<button type="button" data-t="rTail">5단계 · 꼬리에 작살</button>',
'<button type="button" data-t="rMashB">열기 · 숨 참기(2단계 앞)</button>',
'<button type="button" data-t="rTailDry">5단계 · 숨이 마름</button>',
'<span style="width:10px"></span>',
'<span style="font-size:12px;color:#c4d0dc">1단계 명중 확률 기준</span>',
'<button type="button" data-p="0.1">10%</button><button type="button" data-p="0.25" class="on">25%</button><button type="button" data-p="0.5">50%</button>',
'<label><input type="checkbox" id="mgtGod" checked> 피해 무시(사망 대신 다시)</label>',
'</div><div class="row" style="margin-top:6px">',
'<b style="color:#c9d6e6">검은 고래</b>',
'<button type="button" data-t="kEnc">1단계 · 조우(등불 ①)</button>',
'<button type="button" data-t="kLamp">등불 덮기(2단계 앞)</button>',
'<button type="button" data-t="kGap">2단계 · 닫히는 날개</button>',
'<button type="button" data-t="kStars">3단계 · 꺼지는 별</button>',
'<button type="button" data-t="kPulse">4단계 · 감싸인 배</button>',
'<button type="button" data-t="kFinal">5단계 · 날개 끝</button>',
'<button type="button" data-t="kFinalBlind">5단계 · 등불이 꺼짐</button>',
'</div><div class="row" style="margin-top:6px">',
'<b style="color:#d9c2ff">선장 · 신과 망</b>',
'<button type="button" data-t="mer">인어 조우(망 두르기)</button>',
'<button type="button" data-t="judge0">정신력 0 판정 · 첫 판정</button>',
'<button type="button" data-t="judge1">정신력 0 판정 · 개화 후</button>',
'<button type="button" data-t="shop0">항구 상점 · E.G.O 전</button>',
'<button type="button" data-t="shop1">항구 상점 · 수련</button>',
'<span style="width:10px"></span>',
'<span style="font-size:12px;color:#c4d0dc">사냥 중간 단계에 두른 망</span>',
'<button type="button" data-m="0">0</button><button type="button" data-m="3" class="on">3</button><button type="button" data-m="4">4</button><button type="button" data-m="5">5</button>',
'</div><div class="note">테스트 전용 페이지입니다. 진짜 저장 데이터와 업적에는 영향을 주지 않으며, 새로고침하면 처음 상태로 돌아갑니다. 1단계는 아군 전투력에 따라 난이도가 달라지므로 명중 확률 기준을 골라 바꿔 볼 수 있습니다. 조우 장면에서는 직접 망 개수를 고르고, 사냥 중간 단계 버튼은 위에서 고른 망 개수를 두른 상태로 시작합니다. 피해 무시는 선장 정신력에는 적용되지 않습니다.</div></div>'
].join('\n');

var CONTROL=[
'<script>',
'(function(){',
' var P=0.25,M=3;',
' function closeModals(){Array.prototype.forEach.call(document.querySelectorAll("button"),function(b){if(b.textContent.indexOf("창 닫기")>=0)b.click();});}',
' function base(){',
'  closeModals();state.redWhaleFinal023=false;state.blueWhaleFinalStage=false;state.blackWhaleFinal=false;state.pallidHunt161=null;',
'  state.sea=true;if(state.current==null)state.current=(state.offered&&state.offered[0])||1;',
'  state.hull=100;state.mind=100;state.exposure=0;state.pallor155=0;state.pallorWard=5;state.pallidVictory162=false;state.grade=Math.max(state.grade||0,5);state.calamityHarpoon={damaged:false};',
'  state.captainMind=100;state.egoBloomed=true;state.egoName=state.egoName||"시험용 E.G.O";state.shinOpen=true;state.shinLevel=5;state.mindJudge=null;state.mangActive=M;state.gold=Math.max(state.gold||0,1000);',
'  if(state.crew&&!state.crew.length)state.crew.push({id:99,role:"lower",condition:1});',
' }',
' function blue(kind){',
'  state.blueWhaleFinalStage=false;state.blueHunt=null;state.battle=null;if(window.BlueHuntGame){BlueHuntGame.mode=null;}tab="play";',
'  if(kind==="bEnc"){state.encounter=1;state.scene="encounter";sync();return;}',
'  var won={bPierce:0,bMer:1,bChase:1,bEvade:2,bFinal:3,bFinalBlind:3}[kind],ph={bPierce:"pierce",bChase:"chase",bEvade:"evade",bFinal:"final",bFinalBlind:"final"}[kind];',
'  var w={type:"whale",index:1,name:WHALES[1].name,power:WHALES[1].power,need:4,won:won,history:[],after:"whale"};',
'  if(kind==="bMer"){state.blueHunt={phase:"mermaid",whale:w};state.scene="blueHunt";sync();return;}',
'  state.battle=w;state.blueHunt={phase:ph};if(kind==="bFinalBlind")state.blueHunt.trails=[1,2];state.scene="battle";state.lastCoin=null;sync();',
' }',
' function red(kind){',
'  state.redWhaleFinal023=false;state.battle=null;state.redBreath023=null;if(window.RedHuntGame){RedHuntGame.mode=null;}tab="play";',
'  if(kind==="rEnc"){state.encounter=2;state.scene="encounter";sync();return;}',
'  var won={rMash:0,rParry:1,rHead:2,rTail:3,rMashB:0,rTailDry:3}[kind];',
'  if(kind==="rMashB")state.redBreath023={done:[true,false,false,false],rec:["kept"]};',
'  if(kind==="rTailDry")state.redBreath023={done:[true,true,true,true],rec:["inhaled","inhaled","kept","kept"]};',
'  state.battle={type:"whale",index:2,name:WHALES[2].name,power:WHALES[2].power,need:4,won:won,history:[],after:"whale"};state.scene="battle";state.lastCoin=null;sync();',
' }',
' function black(kind){',
'  state.blackWhaleFinal=false;state.battle=null;state.blackLamp=null;if(window.BlackHuntGame){BlackHuntGame.mode=null;}tab="play";',
'  if(kind==="kEnc"){state.encounter=3;state.scene="encounter";sync();return;}',
'  var won={kLamp:0,kGap:0,kStars:1,kPulse:2,kFinal:3,kFinalBlind:3}[kind];',
'  state.blackLamp=kind==="kLamp"?{done:[true,false,false,false],rec:["kept"]}:kind==="kFinalBlind"?{done:[true,true,true,true],rec:["late","kept","early","kept"]}:{done:[true,true,true,true],rec:["kept","kept","kept","kept"]};',
'  state.battle={type:"whale",index:3,name:WHALES[3].name,power:WHALES[3].power,need:4,won:won,history:[],after:"whale"};state.scene="battle";state.lastCoin=null;sync();',
' }',
' function start(kind){',
'  base();if(/Enc$/.test(kind))state.mangActive=0;',
'  if(kind==="pEnc"){state.battle=null;state.pallidHunt161=null;state.encounter=0;state.scene="encounter";tab="play";sync();return;}',
'  if(kind==="mer"){state.mangActive=0;state.battle=null;state.pallidHunt161=null;tab="play";beginBattle({type:"normal",name:"대호수의 인어",power:Math.max(1,Math.round(crewPower()*.8)),need:1,won:0,history:[],after:"navigation"});return;}',
'  if(kind==="judge0"||kind==="judge1"){state.mangActive=0;state.battle=null;state.pallidHunt161=null;state.sea=false;state.scene="port";tab="play";',
'   if(kind==="judge0"){state.egoBloomed=false;state.egoName="";state.shinOpen=false;state.shinLevel=0;}',
'   state.captainMind=4;CalamityMang.hurt(4,"(테스트)");sync();return;}',
'  if(kind==="shop0"||kind==="shop1"){state.mangActive=0;state.battle=null;state.pallidHunt161=null;state.sea=false;state.scene="port";tab="shop";state.captainRest=null;state.shinLastTry="";state.calamityHarpoon=null;',
'   state.shinOpen=false;state.shinLevel=0;if(kind==="shop0"){state.egoBloomed=false;state.egoName="";}sync();return;}',
'  if(kind.charAt(0)==="k"&&kind.length>3){black(kind);var kx=document.querySelector(".bk3-scene");if(kx)kx.scrollIntoView({block:"center"});return;}',
'  if(kind.charAt(0)==="r"&&kind.length>3){red(kind);var rx=document.querySelector(".rw3-scene");if(rx)rx.scrollIntoView({block:"center"});return;}',
'  if(kind.charAt(0)==="b"&&kind.length>2&&kind!=="bad"){blue(kind);var bx=document.querySelector(".bw3-scene");if(bx)bx.scrollIntoView({block:"center"});return;}',
'  if(kind==="acid"){state.battle=null;state.pallidHunt161={phase:"stomach",ready:true};state.scene=PALLID_SCENE_161;tab="play";sync();}',
'  else if(kind==="heart"){state.battle=null;state.pallidHunt161={phase:"heart",ready:true};state.scene=PALLID_SCENE_161;tab="play";if(window.PallidHeartGame)PallidHeartGame.active=false;pallidStartBattle161("pallidCore161","모든 것을 삼키는 창백한 고래 · 심장 속 심장",220,3);}',
'  else{',
'   state.pallidHunt161={phase:"approach",ready:true};state.scene=PALLID_SCENE_161;tab="play";',
'   if(kind==="shell")pallidStartBattle161("pallidShell161","모든 것을 삼키는 창백한 고래 · 외피",500,1);',
'   else if(kind==="lure")pallidStartBattle161("pallidLure161","모든 것을 삼키는 창백한 고래 · 입을 벌리게 할 작살",210,1);',
'   // 고른 명중 확률 기준에 맞게 적의 전투력을 조정 (combatChance = 아군/(아군+적))',
'   var cp=crewPower();state.battle.power=Math.max(1,Math.round(cp*(1-P)/P));',
'   if(window.PallidHarpoonGame){PallidHarpoonGame.active=false;}',
'   render();',
'  }',
'  var fx=document.querySelector(".pallid-cine-v2");if(fx)fx.scrollIntoView({block:"center"});',
' }',
' document.getElementById("mgt").addEventListener("click",function(e){',
'  var b=e.target.closest("button");if(!b)return;',
'  if(b.dataset.t)start(b.dataset.t);',
'  if(b.dataset.m){M=+b.dataset.m;Array.prototype.forEach.call(document.querySelectorAll("#mgt [data-m]"),function(x){x.classList.toggle("on",x===b);});}',
'  if(b.dataset.p){P=+b.dataset.p;Array.prototype.forEach.call(document.querySelectorAll("#mgt [data-p]"),function(x){x.classList.toggle("on",x===b);});',
'   if(state.battle&&/pallid(Shell|Lure)161/.test(state.battle.type))start(state.battle.type==="pallidShell161"?"shell":"lure");}',
' });',
' // 피해 무시: 미니게임 판정은 그대로 두고 선체·정신·백화만 계속 채워 둔다',
' setInterval(function(){window.__BLUE_NODEATH=window.__MINIGAME_NODEATH=document.getElementById("mgtGod").checked;if(!document.getElementById("mgtGod").checked||typeof state==="undefined")return;',
'  state.hull=100;state.mind=100;state.exposure=0;state.pallor155=0;},200);',
' setTimeout(closeModals,300);',
'})();',
'<\/script>'
].join('\n');

fetch('./index.html',{cache:'no-store'}).then(function(r){return r.text();}).then(function(html){
 html=html.replace(/<head([^>]*)>/i,function(m){return m+'\n'+SHIM;});
 html=html.replace(/<title>[\s\S]*?<\/title>/i,'<title>대호수 · 미니게임 테스트</title>');
 html=html.replace(/<body([^>]*)>/i,function(m){return m+'\n'+TOOLBAR;});
 html=html.replace(/<\/body>(?![\s\S]*<\/body>)/i,CONTROL+'\n</body>');
 document.open();document.write(html);document.close();
}).catch(function(){document.getElementById('loading').textContent='게임 파일을 불러오지 못했습니다. 새로고침해 주세요.';});
})();
</script>
</body>
</html>
