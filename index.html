function normalize0131(){
 if(!state.count||typeof state.count!=='object')state.count={lake:0,return:0,special:0,rumors:0};
 if(!Array.isArray(state.crew))state.crew=[];
 state.crew.forEach(c=>{if(typeof c.name!=='string'||!c.name.trim())c.name=ROLE[c.role]?.name+' '+c.id;});
 if(!state.prog||typeof state.prog!=='object')state.prog={voyage:0,lake:0,fishSold:0,oilCollected:0,coinHeads:0,coinTails:0,mermaidKills:0,goldPeak:state.gold,perfectVoyage:0,fullCrewVoyage:0};
 if(!Number.isFinite(state.fish))state.fish=0;
 if(!Number.isFinite(state.oil))state.oil=0;
 if(!Array.isArray(state.clearedIds))state.clearedIds=[];
 if(!Array.isArray(state.achievements))state.achievements=[];
 if(!Number.isFinite(state.lossesThisVoyage))state.lossesThisVoyage=0;
 if(!state.nav||typeof state.nav!=='object')state.nav=null;
 if(!Number.isFinite(state.fishTries))state.fishTries=0;
 if(!Number.isFinite(state.routeChoiceCount))state.routeChoiceCount=(state.voyage>0&&state.visited?.length>0)?1:0;
 if(!state.scene)state.scene='start';
 if(state.scene==='event'&&state.current!=null&&state.nav===null){
  const old=LAKES[state.current-1];
  state.nav={stage:state.ruleResolved?'sail':'law',sight:false,helm:false,distance:0,
   target:2+(old&&old.risk>=3?1:0),turns:0,lawOk:!!state.ruleResolved,fished:false,transition:false};
 }
}

 };
 for(const a of ACH){if(!a.check)continue;
  const {kind,n}=a.check;

  if(good)award(a.id);
 }
};

function inShop132(){return !busy&&!state.sea&&state.scene==='port';}
function buyRepair132(id){
 const x=SHOP_REPAIRS_132.find(x=>x.id===id);
 if(!inShop132()||!x||state.hull>=100||state.gold<x.cost)return;
 const amount=Math.min(x.amount,100-state.hull);
 state.gold-=x.cost;state.hull+=amount;
 log(x.name+' 완료: 내구도 +'+amount+', '+unitMoney(x.cost)+' 사용.');sync();
}
function buyGear132(id){
 migrate132();const item=SHOP_GEAR_132.find(x=>x.id===id);
 if(!inShop132()||!item||state.equipment.includes(id)||state.gold<item.cost)return;
 state.gold-=item.cost;state.equipment.push(id);
 log(item.name+' 구입 및 장착. '+unitMoney(item.cost)+' 사용.');sync();
}
function recover132(id){
 const x=SHOP_RECOVERY_132.find(x=>x.id===id);
 if(!inShop132()||!x||state.gold<x.cost)return;
 if(x.kind==='mind'){
  if(state.mind>=100)return;
  state.gold-=x.cost;state.mind=Math.min(100,state.mind+x.amount);
 }else{
  if(!state.crew.some(c=>c.condition>0))return;
  state.gold-=x.cost;
  state.crew.forEach(c=>c.condition=Math.max(0,c.condition-x.amount));
 }
 log(x.name+' 이용. '+unitMoney(x.cost)+' 사용.');sync();
}
const beforePowerShop132=crewPower;
crewPower=function(){
 migrate132();let result=beforePowerShop132();
 for(const x of SHOP_GEAR_132){
  if(state.equipment.includes(x.id)){
   result+=x.id==='crewHarpoon'?x.atk*state.crew.length:x.atk;
  }
 }
 return result;
};
const beforeDamageShop132=takeDamage;
takeDamage=function(h,m){
 migrate132();
 let mindReduce=0,hullReduce=0;
 for(const x of SHOP_GEAR_132){
  if(state.equipment.includes(x.id)){mindReduce+=x.mind;hullReduce+=x.hull;}
 }
 const hh=h>0?Math.max(1,Math.ceil(h*(1-hullReduce))):h;
 const mm=m>0?Math.max(1,Math.ceil(m*(1-Math.min(mindReduce,.65)))):m;
 return beforeDamageShop132(hh,mm);
};
repair=function(){};rest=function(){};
function renderShop132(){
 migrate132();const available=inShop132();
 let h='<div class="inset"><h2>항구 상점</h2><p class="muted">선체는 자연 회복되지 않습니다. 수리·구매·회복은 항구에서만 가능합니다.</p>'+tag('보유 '+unitMoney(state.gold))+tag('선체 '+state.hull+'/100')+'</div>';
 h+='<div class="inset"><h3>1. 선박 수리</h3><div class="stack">';
 for(const x of SHOP_REPAIRS_132){
  h+=button(x.name+' · 내구도 +'+x.amount+' · '+unitMoney(x.cost),'shopRepair',x.id,'primary',!available||state.gold<x.cost||state.hull>=100);
 }
 h+='</div></div><div class="inset"><h3>2. 장비 구매</h3><p class="muted">구매 즉시 장착되어 효과가 적용됩니다.</p>';
 for(const group of ['선장용','선원용']){
  h+='<h3>'+group+'</h3><div class="stack">';
  for(const item of SHOP_GEAR_132.filter(x=>x.group===group)){
   const owned=state.equipment.includes(item.id);
   const desc=(item.atk?'전투력 +'+item.atk+(item.id==='crewHarpoon'?' × 승선 선원':'')+' / ':'')+(item.mind?'정신 피해 경감 '+Math.round(item.mind*100)+'% / ':'')+(item.hull?'선체 피해 경감 '+Math.round(item.hull*100)+'% / ':'');
   h+=button(item.name+' · '+unitMoney(item.cost)+' · '+desc+(owned?'[구매 완료]':''),'shopGear',item.id,'',!available||owned||state.gold<item.cost);
  }
  h+='</div>';
 }
 h+='</div><div class="inset"><h3>3. 회복</h3><div class="stack">';
 for(const x of SHOP_RECOVERY_132){
  const noNeed=x.kind==='mind'?state.mind>=100:!state.crew.some(c=>c.condition>0);
  h+=button(x.name+' · '+unitMoney(x.cost)+' · '+(x.kind==='mind'?'정신 상태 +'+x.amount:'컨디션 '+x.amount+'단계 개선'),'shopRecover',x.id,'',!available||noNeed||state.gold<x.cost);
 }
 h+='</div></div><div class="inset"><h3>특수 전리품 보관함</h3>';
 const loot=[...WHALE_LOOT.map((x,k)=>[x[0],state.relics['whale_'+k]||0]),...SPECIAL_LOOT.map((x,k)=>[x,state.relics['special_'+k]||0])].filter(x=>x[1]>0);
 h+=loot.length?loot.map(x=>'<p>'+esc(x[0])+' × '+x[1]+'</p>').join(''):'<p class="muted">아직 보관한 특수 전리품이 없습니다.</p>';
 return h+'</div>';
}
document.addEventListener('click',e=>{
 const b=e.target.closest('button[data-act]');if(!b||b.disabled||busy)return;
 if(b.dataset.act==='shopRepair')buyRepair132(b.dataset.value);
 if(b.dataset.act==='shopGear')buyGear132(b.dataset.value);
 if(b.dataset.act==='shopRecover')recover132(b.dataset.value);
});

비운다.","그들이 비켜 선 수면으로 젓는다","배 안으로 들어온 빛이 선원들의 눈에 둥지를 튼다.","외부의 반짝임을 창 안으로 들이지 말라는 말이 있다."],["쪽빛 껍질","쪽빛 파문마다 얇은 껍질이 떠올라 빈 껍데기 같은 소리를 낸다.","껍질 하나가 배 옆에서 천천히 열리고 있다.","그 속을 보지 않고 노를 멈춘다","껍질 안에 손을 넣는다","껍질에서 작은 숨소리가 새어 나온다. 다른 껍질들이 잠잠해진다.","숨소리가 끝날 때까지 발소리를 죽인다","빈 껍질을 배 안으로 건져 올린다","껍질들이 수면 아래 잠기면서 한 줄의 물길을 만든다.","그 줄을 따라 노를 젓는다","껍질 속으로 팔을 넣자 몸 전체가 그 안에 끌려간다.","껍질이 열려도 안을 확인하지 않는 편이 좋다고 한다."],["안개 낀 돛","흰 안개가 물 위가 아니라 높이 매단 돛들 사이에서 움직인다.","안개에 선원의 얼굴 모양이 새겨져 다가온다.","돛을 느슨하게 풀어 얼굴을 흘려보낸다","얼굴을 향해 선원의 이름을 외친다","돛이 처지고 안개 한 덩이가 배 앞에 멈춰 있다.","처진 돛의 끝을 낮게 묶는다","돛을 완전히 펼쳐 안개를 모은다","안개에 빈 구멍이 생겨 앞서 간 배의 물살이 보인다.","그 물살을 따라 나아간다","이름을 들은 얼굴이 갑판에서 주인을 찾아낸다.","안개에 나타난 얼굴에는 이름을 부르지 말라고 한다."],["쇳가루","미세한 쇳가루가 수면 위에서 나침반처럼 한곳을 향해 흐른다.","배 안의 못과 나사가 서서히 진동한다.","자석이 든 물건을 돛대에서 내린다","작살을 물에 던져 흐름을 살핀다","쇳가루가 두 개의 소용돌이를 만든다.","쇳가루가 흐르지 않는 가운데로 키를 맞춘다","가장 큰 소용돌이로 향한다","고요한 띠가 두 소용돌이 사이로 길어졌다.","그 띠를 벗어나지 않고 전진한다","가루가 작살을 타고 올라와 선체의 쇠붙이를 떼어 낸다.","쇳가루가 가리키는 곳은 목적지가 아니라는 전언이 있다."],["황금 이빨","물 위의 금빛 물거품이 뾰족한 이빨 자국을 남긴다.","선수 옆 물거품이 사람 입만큼 벌어진다.","바닷물을 한 국자 떠서 빈 갑판에 붓는다","거품 안에 동전을 던진다","갑판에 부은 물에서 금빛 금이 갈라진다.","금의 길이를 노 끝으로 재 본다","금을 손가락으로 긁는다","재어진 길이만큼 물거품이 떨어져 나가 빈 수역이 드러난다.","이빨이 닿지 않는 쪽으로 건넌다","거품은 동전을 받아먹고 배 전체를 다음 먹이로 삼는다.","금빛 이빨은 돈을 주어 달래는 존재가 아니라는 말이 있다."],["한숨 고이는","수면 위에 작은 구름들이 떠 있고 그 안에서 사람의 한숨이 난다.","한숨이 선원들 목소리를 흉내 내기 시작한다.","선원들에게 짧게 숨을 멈추게 한다","따라 한숨을 길게 내쉰다","구름들이 말을 멈추고 물 위에 가라앉아 있다.","구름에 닿지 않도록 낮게 노를 젓는다","구름을 손으로 밀어낸다","물 위에 남은 빈 자리가 점점 커져 선박 너비가 된다.","그 빈 곳을 지그재그 없이 통과한다","따라 내쉰 숨이 다시 몸속으로 돌아오지 않는다.","그곳의 한숨은 되받아 주지 않는 편이 좋다는 소문이 있다."],["바늘비","물 위에 아주 가느다란 선들이 꽂혀 빗방울도 아닌 바늘 소리를 낸다.","바늘 같은 빗줄기가 모자 끝을 꿰매려 한다.","천막을 펼쳐 선원들의 머리 위를 가린다","손바닥을 펴서 빗줄기를 받아낸다","천막 위에 바늘들이 한 방향으로 쌓인다.","천막을 기울여 선미 밖으로 흘려보낸다","천막을 갑판 한복판에 털어 낸다","바늘이 없는 물살이 배 앞에 생겨났다.","그곳에 노를 넣는다","쥐었던 빗줄기가 손가락에서 뼈처럼 자라난다.","바늘비를 선박 안에 떨어뜨리지 말라는 말이 있다."],["푸른 재","푸른 재가 하늘로 올라가는 모습이 물속에 거꾸로 비친다.","재 한 줌이 선장의 어깨 위로 내려앉는다.","어깨에 내려앉은 재를 입으로 불지 않는다","재를 입으로 털어낸다","재가 옷자락으로 흘러내려 작은 줄무늬를 만든다.","줄무늬가 끝날 때까지 몸을 움직이지 않는다","옷을 세차게 털어 낸다","재는 바람을 거슬러 멀어지고 수면은 비어 간다.","푸른 재가 사라진 자리를 가로지른다","재 속에서 사람의 목소리가 피어나 몸을 태운다.","푸른 재를 입김으로 날리면 안 된다고 전해진다."],["붉은 물감","붉은 물감이 풀린 듯한 물이 수면을 덮고, 물길은 보이지 않는다.","마른 붓 하나가 선체 옆을 따라 천천히 움직인다.","손가락에서 피 한 방울을 붓 끝에 묻힌다","호수의 물감으로 갑판에 선을 긋는다","붓 끝이 스스로 물 위에 가는 선을 그리기 시작한다.","붓이 그은 선이 굳기 전에 그 옆에 노를 놓는다","선이 굳을 때까지 기다린다","붉은 선 바깥의 물만 옅어지고 빈 항로가 남는다.","붓이 그은 선의 옆으로 항해한다","물감으로 그린 선이 갑판의 사람을 평면으로 눌러 버린다.","붓에 바칠 것은 물감이 아니라 피라는 소문이 있다."],["붉은 그림자","물에서 붉은 그림자가 나타나는데, 그림자의 주인은 어디에도 없다.","그림자가 배의 앞을 막아서며 점점 커진다.","노를 뒤로 들어 그림자와 거리를 둔다","그림자를 발로 밟는다","그림자가 작아졌다가 두 갈래로 나뉘었다.","더 작은 그림자만 따라가며 돛을 낮춘다","큰 그림자에 배를 붙인다","작은 그림자가 물속으로 사라지고 수면이 비었다.","그 자리를 넘어 전진한다","밟힌 그림자가 다리에 달라붙어 안쪽부터 붉게 물들인다.","그림자는 작은 쪽을 따라가야 한다는 말이 있다."],["은색 고리","은색 고리들이 수면 위로 떠올라 서로의 자리를 바꾼다.","가장 가까운 고리가 노를 건드리며 울린다.","노를 물 밖에 들고 고리가 지나가길 기다린다","고리를 손으로 잡아 고정한다","고리들이 한 번에 세 개씩 포개진다.","포개진 가운데를 따라 방향을 맞춘다","포개진 고리 하나를 배에 싣는다","겹친 고리들이 풀리며 길게 늘어서기 시작한다.","마지막 고리 바깥으로 돌아 나간다","붙잡은 고리가 몸통을 조여 금속 장신구처럼 만든다.","고리를 소유하려 들지 말라는 전언이 있다."],["종이 배","종이처럼 접힌 작은 배들이 선체 주위를 맴돌고 있다.","종이 배 하나가 배 위에 올라와 접힌 방향을 바꾸고 있다.","종이 배를 다시 접지 않고 물에 돌려보낸다","종이 배의 접힌 부분을 펼쳐 본다","돌려보낸 종이 배들이 서로 다른 쪽으로 떠난다.","한 척도 따라가지 않고 가운데 머문다","가장 큰 종이 배를 따라 움직인다","가운데 물이 아래로 접혀 좁은 길이 드러난다.","접힌 물결 사이로 젓는다","펼친 종이에 당신의 이름이 적혀 배가 종이처럼 접힌다.","남의 배를 펼쳐 보면 안 된다는 말이 있다."],["세모난 파도","모든 파도가 마치 세모난 지붕을 닮았고 꼭짓점에서 물이 쏟아진다.","높은 파도 하나가 세 모서리를 선박 쪽으로 돌린다.","가장 낮은 모서리의 그림자에 배를 붙인다","세 모서리의 가운데로 돌진한다","세모 파도가 뒤집혀 뾰족한 아래면을 드러냈다.","뾰족한 아래면이 가라앉을 때만 앞으로 민다","파도가 올라오는 순간 노를 세게 젓는다","파도의 꼭짓점이 부서져 사각의 빈 수면이 생겨났다.","빈 수면 한가운데로 건넌다","꼭짓점이 선체를 관통해 배의 안과 밖이 뒤섞인다.","세모 파도의 중심은 가장 위험하다는 말이 있다."],["달팽이 껍질","거대한 나선 모양 껍질들이 물속에서 느리게 회전한다.","껍질의 작은 구멍으로 휘파람 같은 바람이 나온다.","휘파람이 멎을 때까지 돛을 접는다","구멍 안으로 소리를 외친다","바람이 멎자 껍질의 나선이 바깥쪽으로 움직인다.","나선이 펼쳐지는 쪽으로 노를 돌린다","나선이 감기는 쪽으로 붙는다","껍질들이 일제히 등을 돌리고 좁은 통로가 드러났다.","열린 통로를 따라 나아간다","구멍 안의 메아리가 배 전체를 나선 속으로 끌어간다.","껍질을 향해 먼저 대답하지 말라는 전언이 있다."],["비단 해초","수면에는 천 같은 해초가 흘러가고, 결이 바람을 거슬러 움직인다.","해초가 선체를 부드럽게 감싸며 매듭을 만든다.","묶인 곳의 매듭만 느슨하게 푼다","해초의 끄트머리를 당겨 끊는다","매듭을 풀자 해초의 결이 한쪽으로 누웠다.","누운 결을 따라 노를 살짝 밀어본다","해초를 거슬러 배를 돌린다","해초가 수면 아래로 내려가 장막처럼 열렸다.","열린 장막 너머로 젓는다","잡아당긴 끝에서 커다란 혀가 풀려 나와 선원을 감는다.","그 해초는 베지 말고 풀어야 한다는 이야기가 있다."],["석고 인형","석고색 사람 형상들이 물 위에서 허리까지만 떠올라 있다.","인형 하나가 맨 앞의 선원과 같은 동작을 한다.","선원에게 팔을 몸에 붙인 채 움직이지 말라 한다","인형을 향해 손을 흔든다","인형이 동작을 멈추고 물 위로 비스듬히 누웠다.","인형이 눕는 방향과 반대로 키를 꺾는다","인형을 배 위로 끌어올린다","흰 인형들이 물속에 잠기고 틈이 생겼다.","잠긴 자리 위를 신속히 항해한다","손을 흔든 선원의 살결이 석고처럼 굳어 버린다.","그곳의 인형과 동작을 맞추면 안 된다고 한다."],["푸른 유성","푸른 빛줄기가 물 아래에서 위로 떨어진다. 떨어진 자리만 반짝인다.","빛 하나가 배 밑을 지나가면서 흔적을 남긴다.","빛의 끝이 아닌 시작점을 살핀다","빛이 끝나는 자리에 작살을 꽂는다","빛의 시작점에 작은 물방울이 거꾸로 떠오른다.","물방울이 떠오른 뒤 키를 한 번만 꺾는다","물방울이 생기기 전 급선회한다","파란 흔적이 한 방향으로 이어져 곧은 길이 되었다.","길의 처음부터 끝까지 전진한다","작살에 맞은 빛이 선저를 뚫고 별처럼 폭발한다.","푸른 유성은 사라진 끝보다 시작을 보라고 한다."],["끊어진 메아리","물에 닿는 소리가 반쯤만 돌아오고 나머지는 잠겨 버린다.","선원의 말끝이 물 위에서 끊기고 다른 곳에서 이어진다.","마지막 한 음절은 입 밖에 내지 않는다","끊긴 말을 끝까지 반복한다","입을 다물자 물 위에서 자신의 목소리가 느리게 흩어진다.","목소리가 전부 사라진 후 키를 움직인다","목소리가 남은 채 휘파람으로 신호한다","메아리 없는 공간이 앞으로 길게 뻗었다.","그 고요한 곳을 지나간다","완성된 말이 선원을 대신해 물속에서 대답한다.","그 물 위에서는 문장을 끝내지 말라는 말이 있다."],["잿빛 천칭","잿빛 물 위에서 두 개의 낡은 저울판이 흔들리고 있다.","왼쪽 저울판에 돌이 놓이고 오른쪽은 비어 있다.","배 안의 돌 한 개를 오른쪽 저울에 올린다","왼쪽 돌을 훔쳐 갑판으로 가져온다","양쪽 판이 잠시 같은 높이에 멈춰 섰다.","저울이 움직이지 않는 동안 노를 내린다","저울을 손으로 더 흔든다","저울의 줄이 풀려 물 아래로 내려갔다.","저울이 가라앉은 길을 따라 전진한다","훔친 돌의 무게가 선체 전체를 눌러 가라앉힌다.","물 위의 저울은 빼앗지 말고 균형을 맞춰야 한다고 한다."],["등대지기","등대가 없는 수면에 등대 불빛의 그림자만 길게 비친다.","빛의 그림자가 배의 등불을 향해 손을 뻗는다.","등불의 심지를 조금 내려 빛을 낮춘다","빛의 그림자에 횃불을 가까이 댄다","빛이 약해지자 수면의 그림자가 뒤로 물러났다.","그림자가 멀어진 동안 등불을 아래쪽으로 비춘다","빛을 다시 크게 키운다","물 아래에 얇은 길이 드러나며 그림자는 지워졌다.","드러난 길 위로 천천히 젓는다","그림자가 불꽃을 먹고 배 안쪽까지 퍼져 들어온다.","그곳에서는 밝을수록 길을 잃는다는 말이 있다."],["꿈틀대는 거울","거울 조각 같은 수면이 따로따로 흔들리며 움직인다.","자신을 비춘 조각 하나가 눈을 먼저 감는다.","거울을 따라 눈을 감지 않고 시선을 내린다","조각을 따라서 동시에 눈을 감는다","조각이 웃는 얼굴로 바뀌면서 뒤집혔다.","웃는 조각이 바닥을 향할 때 노를 넣는다","웃는 얼굴을 손가락으로 만진다","조각들이 서로 엇갈려 빈 길을 남겼다.","빈 틈을 놓치지 않고 전진한다","동시에 눈을 감자 다시 뜰 수 없게 된다.","거울의 움직임을 그대로 따라 해선 안 된다고 한다."],["흑단 연꽃","검은 연꽃들이 물 위에 떠 있고 꽃잎의 안쪽만 희게 빛난다.","가장 큰 꽃이 갑판 가까이 다가와 꽃잎을 접는다.","꽃잎 바깥에 노 끝을 가만히 댄다","꽃의 안쪽을 손으로 만진다","노 끝에 닿은 꽃잎이 천천히 바깥으로 펼쳐졌다.","펼쳐진 꽃잎이 가리키는 쪽으로 돛을 낮춘다","꽃잎을 꺾어 배에 싣는다","꽃무리가 배 양쪽으로 갈라지고 수로가 남았다.","연꽃 사이의 길을 지나간다","꽃의 안쪽에서 혀가 돋아 손목을 붙잡는다.","연꽃의 중심에는 손을 대지 않는 것이 좋다고 한다."],["비취 가시","비취색 가시들이 수면에 박혀 자꾸 다른 방향으로 기울어진다.","가시 하나가 노날을 누르며 윗부분을 떨고 있다.","노를 뽑지 않고 가시가 스스로 놓기를 기다린다","가시를 밟아 부러뜨린다","노날이 풀리자 가시가 줄지어 같은 곳을 향했다.","가시가 가리키는 곳에서 한 뼘 옆으로 키를 튼다","가시가 가리키는 정면으로 향한다","가시들이 가라앉아 좁은 수역을 드러냈다.","흔들림이 멎은 수면으로 젓는다","부러진 가시가 배 밑으로 돋아 선체를 찢어 놓는다.","비취 가시의 방향을 곧장 믿으면 안 된다고 한다."],["눈먼 등불","등불처럼 생긴 둥근 알갱이들이 물에 떠 있지만 하나도 빛나지 않는다.","빛나지 않는 등불 한 개가 선실 창으로 다가온다.","선실의 빛을 가리고 등불의 그림자를 본다","둥근 알갱이를 불에 태운다","그림자 하나가 다른 등불의 위치를 가리켰다.","그림자가 가리킨 두 번째 등불을 건드리지 않는다","가리킨 등불을 배에 건진다","등불들이 하나씩 물속으로 잠기며 숨은 길이 열렸다.","잠긴 자리 위로 배를 모은다","불을 붙인 알갱이에서 검은 눈이 떠올라 선원을 바라본다.","불을 붙이지 않아도 등불은 길을 알려 준다고 한다."],["가라앉는","수면이 평평한데도 짐들은 물을 향해 무겁게 기울어진다.","갑판의 작은 궤짝 하나가 물쪽으로 미끄러진다.","궤짝을 바깥이 아닌 돛대 밑으로 옮긴다","궤짝을 물에 던져 무게를 줄인다","무게 중심이 옮겨지자 배가 잠시 위로 뜨는 듯하다.","선미에 선 선원 한 명을 배 중앙으로 부른다","선원 전원을 뱃전 끝으로 이동시킨다","선체의 기울기가 멎고 잔잔한 물길이 열린다.","균형을 유지하며 젓는다","물에 던진 궤짝에서 손이 나와 배를 끌어 내린다.","가라앉는 배에서는 물건을 버리지 말고 무게를 모으라는 말이 있다."],["따뜻한 얼음","얼음 조각이 온기를 띤 채 물 위에 떠 있다. 닿은 곳마다 김이 난다.","따뜻한 얼음 한 장이 선체에 붙어 점점 넓어진다.","얼음과 선체 사이에 마른 나무판을 끼운다","얼음을 맨손으로 떼어낸다","나무판이 온기를 받아 느리게 휘어지기 시작한다.","나무판이 휜 방향과 반대로 노를 밀어낸다","얼음을 쇠망치로 깨뜨린다","따뜻한 얼음이 스스로 둘로 갈라져 길이 열렸다.","갈라진 틈의 물을 따라 항해한다","얼음이 손에서 녹으며 살갗을 새하얗게 지워 버린다.","온기를 띤 얼음엔 손 대신 나무를 대라고 한다."],["동전이 우는","구리빛 동전들이 물속에서 울음을 내며 떠 있다.","가장 오래된 동전에서 낮은 신음이 올라온다.","갑판의 빈 주머니를 동전 앞에 펼쳐 둔다","우는 동전을 주워 주머니에 넣는다","주머니가 비어 있는데도 울음소리가 그 안에서 들린다.","빈 주머니를 접어 갑판 밑에 넣는다","주머니를 수면 위에 던진다","물속의 동전들이 모두 조용해지고 길이 열렸다.","소리가 끝난 쪽으로 노를 젓는다","주운 동전이 목구멍에서 울어 숨을 막는다.","우는 돈을 주우면 빚이 된다는 이야기가 있다."],["핏빛 모래","물 밑의 모래가 붉은 띠처럼 솟아올랐다 가라앉는다.","모래가 배 주위를 돌며 이름 없는 표시를 그린다.","모래가 그린 바깥 원에 노를 세운다","붉은 표시를 발로 문지른다","바깥 원이 느리게 풀리면서 모래가 아래로 떨어진다.","모래가 가라앉는 순간 노를 물속으로 넣는다","모래가 다시 솟을 때 세차게 저어 나간다","바닥에 남은 표시가 사라지고 넓은 틈이 열린다.","흐려진 표식 너머로 항해한다","문지른 표시가 피부 아래 붉은 모래를 쌓는다.","모래가 만든 모양은 지우지 않는 편이 좋다고 한다."],["거꾸로 흐르는","물살이 배를 밀고 나서야 파도가 만들어진다.","배 뒤편에서 파도가 앞쪽의 돛 그림자를 끌고 간다.","돛을 먼저 접고 노의 방향을 살핀다","뒤에서 미는 힘에 몸을 맡긴다","노를 들어 올리자 뒤쪽 파도가 조용해졌다.","조용한 선미를 기준으로 키를 반 바퀴 돌린다","곧바로 돛을 전부 펼친다","뒤쪽 물이 먼저 갈라져 앞쪽에 길이 생겼다.","뒤에 생긴 길을 앞쪽으로 이어 간다","물살이 배를 거꾸로 접어 선수를 선미 안으로 밀어 넣는다.","이곳에서는 파도가 지나간 뒤에야 배를 움직여야 한다고 한다."],["비늘 덮인","수면에 물결 대신 겹친 비늘들이 빛난다.","큰 비늘 한 장이 뒤집히며 반짝이는 안쪽을 드러낸다.","비늘의 위쪽이 다시 닫힐 때까지 멈춘다","비늘의 안쪽을 갈고리로 긁는다","비늘이 닫히자 다른 비늘들이 느리게 들썩인다.","가장 작게 들썩이는 비늘의 옆으로 키를 꺾는다","큰 비늘이 움직이는 쪽으로 향한다","비늘 사이로 검은 물살이 보이기 시작했다.","그 물살에 노를 얹어 건넌다","긁힌 비늘 아래에서 거대한 턱이 솟아 배를 문다.","거대한 비늘의 뒤편에는 닿지 말라고 한다."],["붉은 가루","핏빛보다 옅은 가루가 물을 타고 돌아다니며 선원들의 손을 훑는다.","한 알의 가루가 손등 위에서 피를 기다리는 듯 맴돈다.","피를 흘리지 않고 마른 소금 한 꼬집을 수면에 뿌린다","손을 베어 핏방울을 떨어뜨린다","가루들이 소금을 감싸고 무거워져 물속으로 가라앉는다.","가루가 모두 가라앉을 때까지 손을 선실 안에 둔다","남은 가루를 손으로 만진다","붉은 가루가 사라지고 빈 항로가 생겼다.","맨손을 보이지 않은 채 통과한다","가루는 피를 따라 선원의 살 속에서 다시 태어난다.","가루가 피를 먹으면 사람이 아니게 된다는 전언이 있다."],["단단한 껍질","갈라지지 않는 거대한 껍데기가 물 위를 둥글게 감싸고 있다.","껍질 안쪽에서 무엇인가 가볍게 두드린다.","소리의 수를 세지 않고 뱃전을 한 번만 만진다","안쪽 소리에 맞춰 세게 두드린다","껍데기 표면에서 작은 흰 점들이 일어났다.","점들이 껍질 아래로 들어갈 때까지 선체를 세운다","흰 점을 갈고리로 긁어 낸다","껍질의 아래면이 들리며 수로가 열렸다.","들린 가장자리 아래로 지난다","두드린 소리를 들은 거대한 껍질이 배를 물어뜯는다.","껍데기 안쪽의 두드림에 맞춰 답해서는 안 된다고 한다."],["아무 색 없는","수면이 검은 것도 흰 것도 아니다. 물의 윤곽만 겨우 보인다.","갑판에 놓인 천이 한순간 투명해졌다.","천을 접어 뚜껑 있는 상자에 넣는다","천의 색이 어디 갔는지 손으로 만져 본다","상자 아래에 그림자 하나가 생겨났다.","그림자에 닿지 않도록 상자를 선미로 옮긴다","상자를 열어 색을 찾는다","그림자는 배에 남고 수면의 외곽만 나타났다.","나타난 외곽을 따라 조심히 건넌다","천을 만진 손부터 색과 피부가 함께 사라진다.","없어진 색을 찾으려 들면 안 된다는 말이 있다."],["보랏빛 휘장","보라색 천 같은 물결이 하늘로 높이 걸려 있다.","휘장의 자락이 배 위로 내려와 선원의 모자를 가린다.","모자를 벗지 말고 자락을 옆으로 밀어 둔다","자락을 움켜쥐어 찢어 버린다","휘장 아래에서 작은 매듭이 저절로 묶인다.","매듭이 완성될 때까지 선박을 멈춘다","매듭을 풀어 묶인 천을 가져간다","휘장이 천천히 걷히며 너머 수면이 보인다.","걷힌 자락 아래로 지나간다","찢어진 자락에서 머리 없는 형상이 내려온다.","휘장에는 손을 대도 찢으면 안 된다고 전해진다."],["무지개 비늘","일곱 빛깔 비늘들이 물 아래에서 둥근 궤도로 돈다.","가장 어두운 비늘 한 장이 배 밑으로 들어간다.","비늘을 따라가지 않고 배의 가운데를 비운다","가장 화려한 비늘을 작살로 찍는다","어두운 비늘이 지나자 밝은 비늘들이 한꺼번에 모였다.","모인 비늘들의 그림자 반대쪽으로 키를 젓는다","가장 밝은 비늘과 나란히 전진한다","비늘의 띠가 끊어져 물길 하나가 나타났다.","끊긴 띠를 통과한다","작살에 맞은 비늘이 거대한 지느러미로 자라 선체를 가른다.","밝은 비늘은 미끼라는 이야기가 있다."],["풀숲 우거진","긴 풀잎들이 수면에서 자라 배의 난간보다 높게 서 있다.","풀숲 안쪽에서 작고 낮은 울음이 들린다.","울음소리를 무시하고 돛대를 낮춘다","울음소리를 따라 노를 더 깊이 넣는다","풀잎들이 한 번에 왼쪽으로 누워 물살을 드러낸다.","그들이 누운 자리 위로 밧줄을 던지지 않는다","누운 풀 위에 그물을 펼친다","풀들이 다시 서면서 배 앞에 빈 길을 남겼다.","풀이 다시 서기 전에 통과한다","그물에 걸린 울음의 주인이 배 위로 기어오른다.","풀숲에서 들리는 울음은 지나가는 배를 세우려는 것이라고 한다."],["뱃전의 손","물에서 젖은 손 하나가 올라와 난간을 천천히 두드린다.","손의 손톱이 하나씩 길어지며 수면 위에 자국을 낸다.","난간에 젖은 천을 올려 손톱이 닿지 않게 한다","손을 붙잡아 배 위로 끌어올린다","젖은 천을 쥔 손이 천천히 아래로 내려간다.","천을 되찾지 않고 난간을 정리한다","천을 되찾으려고 손을 좇는다","손이 물속으로 사라지고 배를 가로막던 물결이 풀렸다.","난간을 돌아보기 전에 전진한다","붙잡힌 손이 사람 하나를 통째로 물속으로 데려간다.","그곳의 손은 받아 주되 붙잡지 말라는 말이 있다."],["작살 박힌","녹슨 작살들이 바닥에 꽂혀 있고 작살줄만 수면으로 떠오른다.","가장 가까운 줄이 노 끝에 저절로 감겼다.","노를 놓고 줄이 스스로 풀리기를 기다린다","작살줄을 잡아당긴다","풀린 작살줄이 수면에 세 개의 고리를 만들었다.","가장 작은 고리 밖으로 키를 꺾는다","가장 큰 고리 안으로 배를 민다","고리들이 수면 아래로 내려가 둥근 길이 생겼다.","그 길의 바깥을 따라 벗어난다","뽑힌 작살의 반대편에서 물고기 아닌 것이 솟아나 배를 꿰뚫는다.","작살줄을 끌어당기면 물 아래의 주인이 깨어난다는 소문이 있다."],["진주 파도","진주처럼 작은 물방울들이 파도 끝마다 맺혀 있다.","하나의 물방울이 선장 앞에서 깨어지지 않은 채 떠 있다.","노로 떠 있는 물방울 아래의 물만 가른다","물방울을 손가락으로 터뜨린다","떠 있는 방울이 천천히 두 개로 갈라졌다.","둘 사이의 공기를 가르지 않고 배를 세운다","방울 사이로 돛을 밀어 넣는다","두 방울이 저편으로 떨어져 물길을 비웠다.","물방울이 떨어진 곳의 뒤를 따라간다","터뜨린 방울 안쪽에서 진주 가시가 사람의 눈을 향해 솟는다.","진주 같은 거품은 터뜨리지 말라는 이야기가 있다."],["누운 하늘","구름이 배 바로 아래에 깔리고 하늘의 바람만 물을 움직인다.","배 아래의 구름 하나가 천천히 뱃머리 쪽으로 누웠다.","구름의 그림자보다 높은 위치에 노를 든다","구름 위에 닻을 던진다","노를 높이 들자 아래쪽 구름이 산산이 흩어졌다.","구름 조각이 모두 흩어질 때 노를 내려놓는다","노를 빠르게 휘둘러 구름을 모은다","수면의 높이가 정상으로 돌아오고 낮은 물길이 보였다.","낮아진 물길을 따라 이동한다","닻이 구름을 붙잡자 배 전체가 하늘 아래로 떨어진다.","이곳에서는 닻이 아닌 노로 높이를 재야 한다고 한다."],["호수 밑의 성문","깊은 물 밑에 성문처럼 커다란 석재 구조가 잠겨 있다.","성문 틈새에서 작은 은빛 빛살 하나가 올라왔다.","빛살이 흔들리는 방향에 작은 돌을 던진다","성문을 향해 크게 이름을 외친다","돌이 떨어진 곳에서 잔물결이 성문의 윤곽을 뒤집었다.","뒤집힌 윤곽이 옆으로 누울 때 키를 돌린다","성문 바로 위에 닻을 내린다","성문 위가 아닌 가장자리에서 깊은 수로가 드러났다.","가장자리의 수로로 항해한다","대답한 성문이 갑판 위에 다시 나타나 선박을 가둔다.","잠긴 문은 부르는 것이 아니라 물결로 확인하라는 말이 있다."],["마지막 촛불","수면 위에 불붙은 촛불 하나가 떠 있고 주위는  if(match){const l=LAKES[Number(match[1])-1];if(l)a.name=l.storyNo+' · '+l.name+' 통과';}
 if(['whale1','whale3'].includes(a.id)||/^whale_hunt_\d+$/.test(a.id))a.tier='miracle';
}
/* 기존에 통과한 51~100번 호수 업적은 보관함의 과거 항로로 존치합니다. */
LAKES.splice(50);RULES.splice(50);
function makeStory014(l){
 const d=STORY_DEFS[l.id-1],start=Array.isArray(d.start)?d.start[rng(d.start.length)]:d.start;
 return {id:l.id,step:start,turns:0,result:''};
}
const prevEnter014=enterNextLake0131;
enterNextLake0131=function(id){
 if(id<1||id>50)return;
 state.lakeStory=makeStory014(LAKES[id-1]);
 prevEnter014(id);
};

/* 모든 호수 사건의 이동 선택. 실제로 길이 열린 장면에서만 통과합니다. */
function storyChoicesVisible014(st,node){
 const originals=node.choices||[];
 const hasAdvance=originals.some(x=>x.advance);
 return hasAdvance?originals:[...originals,{text:'노를 저어 나아간다',advance:true}];
}
function storyStageReady014(node){
 return !!(node?.choices||[]).some(x=>x.pass===true);
}
function storyFailToAdvance014(lakeName){
 const ending=lakeName+'에서 아직 길이 열리지 않았다. 노를 젓자 배 밑의 물이 벌어졌고, 선장과 선원들이 그 아래로 떨어졌다. 항해는 그 자리에서 끝났다.';
 log(ending);die();state.storyDeath=ending;save();render();
}
function storyChoice014(i){
 if(state.scene!=='event'||!state.current||!state.lakeStory)return;
 const st=state.lakeStory,d=STORY_DEFS[state.current-1],node=st.step==='afterMermaid'?{
  text:'인어의 소란을 넘기자 열렸던 물길이 다시 나타난다.',
  choices:[{text:'물빛이 갈린 곳을 따라 끝까지 통과한다.',pass:true}]
 }:d.nodes[st.step],options=storyChoicesVisible014(st,node),option=options[i];
 if(!option)return;
 // 조건이 없는 출발은 선택 즉시 사망하며 다른 규칙 처리를 거치지 않습니다.
 if(option.advance&&!storyStageReady014(node)){
  storyFailToAdvance014(d.name);return;
 }
 st.turns++;
 if(!state.nav)state.nav={stage:'law',turns:0,transition:false};
 state.nav.turns=st.turns;
 // 조건 충족 장면의 이동 선택은 해당 장면의 원래 통과 처리와 같습니다.
 if(option.advance){
  const pass=node.choices.find(x=>x.pass);
  if(!pass)return;
  option={...pass,text:option.text};
 }
 if(state.current===39&&st.step==='first'&&i===1){
  // 21-39: 피를 바치는 것은 금기. 선원 인어화 또는 인어 출현.
  if(state.crew.length&&Math.random()<.5){
   const c=state.crew[rng(state.crew.length)];
   state.crew=state.crew.filter(x=>x.id!==c.id);
   log(c.name+'이(가) 붉은 가루에 잠식되어 인어로 변했다.');
  }else{
   st.result='피비린내가 퍼졌다. 붉은 가루 사이에서 인어가 올라온다.';
   beginBattle({type:'normal',name:'붉은 가루의 인어',power:64,need:1,won:0,history:[],after:'navigation'});
   return;
  }
  st.result='승선 인원 한 명이 수면 아래로 사라졌다.';
  st.step='first';sync();return;
 }
 if(option.death){
  const msg=option.death;log(d.name+': '+msg);die();state.storyDeath=msg;save();render();return;
 }
 if(option.harm){
  takeDamage(option.harm,Math.max(2,Math.floor(option.harm/3)));
  if(!safeCheck())return;
 }
 if(option.pass&&state.normalMermaidDraw&&!state.mermaidResolved){
  state.mermaidResolved=true;
  st.step='afterMermaid';st.result='떠나려는 순간 물밑에서 인어가 길을 막아섰다.';
  beginBattle({type:'normal',name:'대호수의 인어',power:35+activeLake().risk*18,need:1,won:0,history:[],after:'navigation'});
  return;
 }
 if(option.pass){
  if(!state.nav){state.nav={stage:'boundary',transition:true,turns:st.turns};}
  state.nav.transition=true;
  state.ruleResolved=true;
  completeLake(true,'정해진 순서대로 수역의 경계를 통과했습니다.');
  return;
 }
 st.step=option.to||st.step;
 st.result=option.result||'물결이 방향을 바꾸었다.';
 if(state.normalMermaidDraw&&!state.mermaidResolved&&st.turns>=2){
  state.mermaidResolved=true;
  beginBattle({type:'normal',name:'대호수의 인어',power:35+activeLake().risk*18,need:1,won:0,history:[],after:'navigation'});
  return;
 }
 if(st.turns>activeLake().limit+5){
  takeDamage(6+activeLake().risk*2,4);
  log('수면이 오래 머문 배를 천천히 짓누른다.');
  if(!safeCheck())return;
 }
 sync();
}
function renderStory014(){
 const l=activeLake(),s=state.lakeStory,d=l&&STORY_DEFS[l.id-1];
 if(!s||!d){
  return '<div class="inset"><h2>호수 사건을 준비하고 있습니다</h2><p>항구로 돌아간 뒤 다시 출항하십시오.</p>'+button('항구로 돌아간다','return','','primary')+'</div>';
 }
 const node=s.step==='afterMermaid'?{
  text:'◈ 인어가 있던 자리의 물결이 다시 잠잠해졌다. 열렸던 경계가 아직 보인다.',
  choices:[{text:'물빛이 갈린 곳을 따라 끝까지 통과한다.',pass:true}]
 }:d.nodes[s.step];
 if(!node){
  // 구형 저장 데이터에 남은 삭제된 장면을 노출하지 않고 현재 호수의 첫 사건으로 복귀합니다.
  const initial=Array.isArray(d.start)?d.start[0]:d.start;
  s.step=initial;s.result='눈앞의 현상이 달라졌다. 선원들과 다시 살펴보아야 한다.';
  save();return renderStory014();
 }
 const r=RULES[l.rule],seen=state.lakeRumorTruth?r.truth():r.false();
 return '<div class="inset" style="border-top:4px solid '+l.hex+'">'+
  '<div class="between"><h2>'+esc(l.storyNo+' · '+l.name)+'</h2>'+tag('창작 구역')+'</div>'+
  '<p class="muted">'+esc(d.description)+'</p>'+
  '<div class="inset"><div class="barline"><span>호수 상태</span><span>체류 '+s.turns+'턴</span></div>'+
  '<div class="meter"><span style="width:'+Math.min(100,s.turns/(l.limit+6)*100)+'%"></span></div>'+
  '<div class="small">선원이 전하는 이야기 · 진위 불명</div><p>“'+esc(seen)+'”</p></div>'+
  (s.result?'<div class="result">'+esc(s.result)+'</div>':'')+
  '<h3>발생 사건</h3><p>'+esc(node.text)+'</p>'+
  '<div class="stack">'+storyChoicesVisible014(s,node).map((o,i)=>button('▸ '+o.text,'storyChoice',String(i),o.pass||o.advance&&storyStageReady014(node)?'primary':'')).join('')+'</div></div>';
}
const prevRender014=renderPlay;
renderPlay=function(){
 if(state.scene==='dead'&&state.storyDeath)return prevRender014()+'<div class="inset warning"><b>마지막 장면</b><p>'+esc(state.storyDeath)+'</p></div>';
 if(state.scene==='event'&&state.current!=null)return renderStory014();
 return prevRender014();
};
const prevAch014=renderAch;
renderAch=function(){
 let h=prevAch014();
 const historical=ARCHIVED_LAKES.filter(a=>state.achievements.includes(a.id));
 if(historical.length)h+='<div class="inset"><h3>과거 항로의 기록</h3><p class="muted">50개 호수 체계 이전에 달성한 업적입니다. 이전 달성 기록은 삭제되지 않습니다.</p><div class="achgrid">'+historical.map(a=>'<div class="achievement '+a.tier+'"><div class="tier">이전 달성</div><b>'+esc(a.name)+'</b></div>').join('')+'</div></div>';
 return h;
};
const prevHelp014=renderHelp;
renderHelp=function(){
 return prevHelp014().replace('총 100개','총 50개').replace('100개 중 중복 없는','50개 중 중복 없는').replace('항해 안내 · v0.1.3.2','항해 안내 · v0.1.4.1');
};
const prevSide014=renderSide;
renderSide=function(){
 prevSide014();
 $('stats').innerHTML=$('stats').innerHTML.replace(' / 100',' / 50');
};
const prevStart014=renderPlay;
renderPlay=function(){
 const body=prevStart014();
 if(state.scene==='start')return body+'<div class="log-update"><h3>업데이트 내역 · V.0.1.4.1</h3><ul><li>호수 100개에서 50개로 개편</li><li>50개 호수 각각의 새로운 다단계 사건·묘사·선택지 추가</li><li>선택에 따른 사망 및 단계별 항해 분기 적용</li><li>재앙 고래 사냥 업적을 기적 등급으로 이동</li><li>기존 달성 업적은 별도로 보존</li></ul></div>';
 return body;
};
document.addEventListener('click',e=>{
 const button=e.target.closest('button[data-act]');
 if(button&&!button.disabled&&!busy&&button.dataset.act==='storyChoice')storyChoice014(Number(button.dataset.value));
});
// 이전 100호수 진행 중이었다면 안전한 항구로 복귀시키되 다른 자산은 유지
if(state.sea&&(state.offered.some(x=>x>50)||state.current>50)){
 state.sea=false;state.scene='port';state.current=null;state.offered=[];state.visited=[];
 state.whalePlaces={};state.encounter=null;state.battle=null;state.specialPending=null;
 state.rumors=[];state.rumorBought=false;state.lakeStory=null;
 log('항로 재편으로 기존 항해를 중단하고 항구에 돌아왔습니다. 승선 인원과 재산은 유지됩니다.');
 save();
}
if(state.scene==='event'&&state.current>0&&state.current<=50&&(!state.lakeStory||state.lakeStory.id!==state.current)){
 state.lakeStory=makeStory014(LAKES[state.current-1]);
 if(typeof state.normalMermaidDraw!=='boolean')state.normalMermaidDraw=Math.random()<.20;
 save();
}

if(state.scene==='route'&&state.sea&&state.routeChoiceCount>0)autoLake0131();else render();

</script>
