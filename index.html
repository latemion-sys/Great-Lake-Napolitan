const SAVE_KEY='great-lake-napolitan-v011';
function fresh(){return {grade:1,gold:150,hull:100,mind:100,xp:0,crew:[{id:1,role:'lower',condition:1}],nextCrew:2,voyage:0,offered:[],visited:[],whalePlaces:{},whaleSeen:[],whaleKilled:[],rumors:[],rumorBought:false,sea:false,current:null,scene:'start',ruleResolved:false,ruleResult:'',blueTorn:false,forceMermaid:false,mermaidResolved:false,battle:null,encounter:null,lastCoin:null,achievements:[],count:{lake:0,return:0,special:0,rumors:0},log:['항구의 새벽. 첫 항해를 준비하십시오.']};}
let state=fresh(), tab='play',busy=false;
try{const saved=JSON.parse(localStorage.getItem(SAVE_KEY));if(saved && [1,2].includes(saved.version) && saved.state && saved.state.grade>=1 && saved.state.grade<=5){state=saved.state;if(saved.version===1){state.scene='port';state.sea=false;state.current=null;state.offered=[];state.visited=[];state.whalePlaces={};state.rumors=[];state.battle=null;state.encounter=null;state.ruleResolved=false;state.ruleResult='';state.forceMermaid=false;state.rumorBought=false;}else if(state.scene==='battle'&&!state.battle)state.scene='route';}}catch(e){console.warn('저장 데이터 복구 실패:',e);}
const $=id=>document.getElementById(id);
const esc=str=>String(str).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const rng=n=>Math.floor(Math.random()*n);
const shuffle=a=>{const b=[...a];for(let i=b.length-1;i>0;i--){const j=rng(i+1);[b[i],b[j]]=[b[j],b[i]];}return b;};
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));

function save(){try{localStorage.setItem(SAVE_KEY,JSON.stringify({version:2,state}));}catch(e){console.warn('저장 실패',e);}}

function award(id){if(!state.achievements.includes(id)){state.achievements.push(id);const a=ACH.find(x=>x.id===id);if(a)log('업적 달성: '+a.name);}}
function trophies(){if(state.voyage>0)award('launch');if(state.count.return>0)award('return');if(state.count.rumors>0)award('rumor');if(state.count.lake>=5)award('lake5');if(state.count.lake>=20)award('lake20');if(state.grade>=3)award('rank3');if(state.grade>=5)award('rank5');if(state.count.special>0)award('special');if(state.whaleKilled.length>=1)award('whale1');if(state.whaleKilled.length>=3)award('whale3');if(state.whaleKilled.length===5)award('all5');}
function setScene(s){state.scene=s;tab='play';sync();}
function sync(){trophies();save();render();}
function safeCheck(){if(state.hull<=0||state.mind<=0){die();return false;}return true;}
function die(){state=fresh();try{localStorage.removeItem(SAVE_KEY);}catch(e){};tab='play';$('content').innerHTML='<div class="inset warning"><h2>항해 종료</h2><p>선박이 더 이상 버틸 수 없습니다. 목숨과 함께 등급, 선원, 재산, 업적을 포함한 모든 진행이 초기화되었습니다.</p><button class="primary" data-act="restart">처음부터 다시 시작</button></div>';renderSide();}
function crewPower(){let n=20+state.grade*8;for(const c of state.crew){const scale=[1.15,1,.65,.3][c.condition];n+=Math.round(ROLE[c.role].power*scale);}return n;}
function crewHealth(){return state.crew.map(x=>CONDITIONS[x.condition]).join(', ');}
function decayCrew(){let msg=[];for(const c of [...state.crew]){if(Math.random()<.21)c.condition=Math.min(3,c.condition+1);const p=c.condition===2?.07:c.condition===3?.2:0;if(Math.random()<p){state.crew=state.crew.filter(x=>x.id!==c.id);msg.push(ROLE[c.role].name+'이(가) 인어로 변이해 사라졌습니다.');}}if(msg.length)log(msg.join(' '));return msg.join('\n');}
function injureCrew(n){state.crew.forEach(c=>c.condition=Math.min(3,Math.max(c.condition,n)));return decayCrew();}
function restCrew(){state.crew.forEach(c=>c.condition=Math.max(0,c.condition-1));}
function takeDamage(h,m){state.hull=Math.max(0,state.hull-h);state.mind=Math.max(0,state.mind-m);}
function activeLake(){return LAKES.find(l=>l.id===state.current);}
function lakeLaw(l){return RULES[l.rule];}
function lakeZone(l){return ZONES[l.zone];}
function prepareVoyage(){if(state.sea)return;const ids=shuffle(LAKES.map(x=>x.id));state.offered=ids.slice(0,LAKE_CAP[state.grade]);const positions=shuffle(LAKES.map(x=>x.id)).slice(0,5);state.whalePlaces={};positions.forEach((id,i)=>state.whalePlaces[id]=i);state.visited=[];state.whaleSeen=[];state.rumors=[];state.rumorBought=false;state.current=null;state.scene='prep';sync();}
function buyRumor(cost){if(state.scene!=='prep'||state.rumorBought||state.gold<cost)return;state.gold-=cost;const ids=shuffle(state.offered).slice(0,3);const truths=ids.map(id=>Math.random()<(cost===0? .4+state.grade*.06:cost===20?.65+state.grade*.045:.85+state.grade*.025));if(!truths.some(Boolean))truths[rng(truths.length)]=true;state.rumors=ids.map((id,i)=>{const l=LAKES[id-1];return {lake:id,text:(truths[i]?lakeLaw(l).truth:lakeLaw(l).false)(lakeZone(l))};});state.rumors=shuffle(state.rumors);state.rumorBought=true;state.count.rumors++;log('술집에서 전언 세 가지를 들었습니다. 진위는 알려지지 않았습니다.');sync();}
function launch(){if(state.scene!=='prep')return;state.voyage++;state.sea=true;state.scene='route';log('제 '+state.voyage+'차 출항. 이번에는 '+state.offered.length+'개 구역에 접근합니다.');sync();}
function returnPort(){if(!state.sea||busy||state.battle||state.encounter)return;state.sea=false;state.current=null;state.offered=[];state.visited=[];state.whalePlaces={};state.rumors=[];state.rumorBought=false;state.scene='port';state.count.return++;if(state.hull===1)award('survive3');log('항구로 무사히 돌아왔습니다. 선원과 배를 정비할 수 있습니다.');sync();}
function promote(){if(state.sea||state.grade>=5||state.scene!=='port')return;const next=state.grade+1;if(state.xp<RANK_XP[next]||state.gold<RANK_COST[next])return;state.gold-=RANK_COST[next];state.grade=next;log('선장 '+next+'등급으로 승급했습니다.');sync();}
function recruit(role){const r=ROLE[role];if(!r||state.sea||state.scene!=='port'||state.grade<r.grade||state.crew.length>=GRADE_CAP[state.grade]||state.gold<r.cost)return;state.gold-=r.cost;state.crew.push({id:state.nextCrew++,role,condition:1});log(r.name+' 한 명이 승선했습니다.');sync();}
function repair(){if(state.sea||state.scene!=='port'||state.gold<35||state.hull>=100)return;state.gold-=35;state.hull=Math.min(100,state.hull+35);log('선체를 정비했습니다.');sync();}
function rest(){if(state.sea||state.scene!=='port'||state.gold<20||!state.crew.some(c=>c.condition>0))return;state.gold-=20;restCrew();log('선원이 휴식을 취했습니다.');sync();}
function selectLake(id){if(!state.sea||state.scene!=='route'||!state.offered.includes(id)||state.visited.includes(id))return;state.current=id;state.scene='event';state.ruleResolved=false;state.ruleResult='';state.blueTorn=false;state.blackCollapse=false;state.mermaidResolved=false;state.forceMermaid=false;state.lakeRumorTruth=Math.random()<.58;const k=state.whalePlaces[id];if(k!==undefined && !state.whaleSeen.includes(k)){state.whaleSeen.push(k);state.encounter=k;state.scene='encounter';applyWhale(k);if(!safeCheck())return;}log(LAKES[id-1].name+'에 진입했습니다.');sync();}
function applyWhale(k){const w=WHALES[k];log('재앙 조우: '+w.name);if(k===0)state.hull=Math.max(1,Math.floor(state.hull/2));if(k===1)state.blueTorn=true;if(k===2)state.crew.forEach(c=>c.condition=Math.max(2,c.condition));if(k===3)takeDamage(9,5);if(k===4){state.crew.forEach(c=>c.condition=Math.max(c.condition,2));takeDamage(0,8);for(const c of [...state.crew]){if(Math.random()<.12){state.crew=state.crew.filter(x=>x.id!==c.id);log(ROLE[c.role].name+' 한 명이 해모의 영향으로 인어로 변했습니다.');}}} }
function escapeWhale(){if(state.scene!=='encounter'||state.encounter===null)return;const k=state.encounter;state.encounter=null;const fail=Math.random()<(k===3?.22:.12);if(fail){takeDamage(k===3?24:14,8);log('재앙에게서 벗어나는 동안 선박이 큰 손상을 입었습니다.');}else log('재앙의 시야에서 벗어났습니다.');if(!safeCheck())return;afterWhale(k);}
function huntWhale(){if(state.scene!=='encounter'||state.encounter===null)return;const k=state.encounter;state.encounter=null;beginBattle({type:'whale',index:k,name:WHALES[k].name,power:WHALES[k].power,need:WHALES[k].hits,won:0,history:[],after:'whale'});}
function afterWhale(k){if(k===3){state.blackCollapse=true;if(Math.random()<.65){specialMermaid(k);}else completeLake(false,'호수 자체가 집어삼켜지는 것을 피해 달아났습니다. 이 구역의 규칙을 조사할 수 없었습니다.');return;}if(k===1)state.blueTorn=true;if(Math.random()<.65){specialMermaid(k);return;}state.scene='event';state.ruleResolved=false;sync();}
function canHuntSpecial(){const roles=state.crew.map(c=>c.role);return state.grade>=3&&roles.includes('harpoon')&&roles.includes('navigator')&&roles.some(x=>['lower','middle','upper'].includes(x));}
function specialMermaid(k){state.specialPending=k;state.scene='special';sync();}
function avoidSpecial(){if(state.scene!=='special')return;state.specialPending=null;takeDamage(7,4);if(!safeCheck())return;if(state.blackCollapse){completeLake(false,'뱉는 인어를 피해 붕괴하는 호수에서 탈출했습니다.');return;}state.scene='event';sync();}
function startSpecial(){if(state.scene!=='special'||!canHuntSpecial())return;const k=state.specialPending;state.specialPending=null;beginBattle({type:'special',index:k,name:WHALES[k].mermaid,power:120+k*14,need:2,won:0,history:[],after:state.blackCollapse?'collapse':'event'});}
function chooseRule(choice){if(state.scene!=='event'||state.ruleResolved)return;const l=activeLake();if(!l)return;state.ruleResolved=true;const effect=state.blueTorn?'torn':RULES[l.rule].effects[choice];if(effect==='torn'){state.ruleResult='청새치 고래가 호수의 규칙을 찢어 놓았습니다. 이 사건은 정상적인 판정을 받지 않습니다. \n선원들은 불안해합니다.';takeDamage(3,4);}else if(effect==='good'){state.ruleResult='위험한 행동을 막았습니다. 호수가 잠잠해집니다. 선원들은 간신히 안도의 숨을 내쉽니다.';state.gold+=8;}else if(effect==='neutral'){state.ruleResult='조심스레 처리했습니다. 큰 재해는 피했지만 선체와 선원들에게 부담이 남습니다.';takeDamage(6,3);}else{state.ruleResult='금기를 건드렸습니다. '+COLOR_GROUPS[l.hue].danger;takeDamage(22+l.risk*3,9+l.risk*2);if(l.id===39&&choice===0){if(state.crew.length&&Math.random()<.5){const victim=state.crew[0];state.crew=state.crew.filter(c=>c.id!==victim.id);state.ruleResult+=' 피를 바친 '+ROLE[victim.role].name+'이(가) 인어로 변했습니다.';}else{state.forceMermaid=true;state.ruleResult+=' 수면 아래에서 인어가 올라옵니다.';}}}log(l.name+': '+state.ruleResult.replace(/\n/g,' ').slice(0,76));if(!safeCheck())return;sync();}
function nextEvent(){if(state.scene!=='event'||!state.ruleResolved)return;const l=activeLake();if(!l)return;if(state.forceMermaid){state.forceMermaid=false;state.mermaidResolved=true;beginBattle({type:'normal',name:'붉은 가루 호수의 인어',power:56+l.risk*18,need:1,won:0,history:[],after:'complete'});return;}if(l.mermaid&&!state.mermaidResolved&&Math.random()<(.13+l.risk*.07)){state.mermaidResolved=true;beginBattle({type:'normal',name:'대호수의 인어',power:35+l.risk*18,need:1,won:0,history:[],after:'complete'});return;}completeLake(true,'호수의 경계에서 벗어났습니다.');}
function completeLake(success,msg){const id=state.current;if(id===null)return;if(!state.visited.includes(id))state.visited.push(id);if(success){state.count.lake++;state.xp++;state.gold+=16+LAKES[id-1].risk*5;}const lost=decayCrew();state.current=null;state.ruleResolved=false;state.ruleResult='';state.blueTorn=false;state.blackCollapse=false;state.forceMermaid=false;state.encounter=null;state.specialPending=null;state.battle=null;log(msg+(lost?' '+lost:''));if(!safeCheck())return;state.scene='route';if(state.visited.length>=state.offered.length){state.sea=false;state.scene='port';state.count.return++;state.offered=[];state.rumors=[];if(state.hull===1)award('survive3');log('이번 출항의 접근 가능한 호수를 모두 지나 항구로 귀환했습니다.');}sync();}
function beginBattle(b){state.battle=b;state.scene='battle';state.lastCoin=null;busy=false;sync();}
function combatChance(){const b=state.battle;return clamp(crewPower()/(crewPower()+b.power),.025,.975);}
function throwCoin(){if(busy||state.scene!=='battle'||!state.battle)return;busy=true;const b=state.battle,win=Math.random()<combatChance();const coin=$('coin'),status=$('coinText'),button=document.querySelector('button[data-act="coin"]');if(!coin||!status||!button){busy=false;return;}button.disabled=true;status.textContent='회전 중... 동전이 수면 위로 솟아오릅니다.';coin.style.setProperty('--landing',win?'1440deg':'1620deg');coin.classList.remove('flipping');void coin.offsetWidth;coin.classList.add('flipping');setTimeout(()=>{if(state.battle!==b){busy=false;return;}resolveCoin(win);busy=false;},1500);}
function resolveCoin(win){const b=state.battle;if(!b)return;b.history.push(win?'앞면 · 유효 타격':'뒷면 · 공격 실패');if(win){b.won++;log(b.name+'에 타격 성공 ('+b.won+'/'+b.need+').');}else{const h=b.type==='whale'?28+rng(12):b.type==='special'?14+rng(8):7+rng(8);takeDamage(h,b.type==='whale'?12:5);log(b.name+'의 반격. 선체 피해 '+h);if(b.type!=='normal'&&state.crew.length){const c=state.crew[rng(state.crew.length)];c.condition=Math.min(3,c.condition+1);}}
 state.lastCoin=win?'앞면 · 승리':'뒷면 · 패배';if(!safeCheck())return;
 if(b.won>=b.need){state.gold+=b.type==='whale'?260:b.type==='special'?80:28;if(b.type==='whale'){if(!state.whaleKilled.includes(b.index))state.whaleKilled.push(b.index);log(b.name+' 사냥 성공!');const index=b.index;state.battle=null;afterWhale(index);return;}if(b.type==='special'){state.count.special++;log(b.name+' 사냥 성공!');}else log('인어를 물리쳤습니다.');const after=b.after;state.battle=null;if(after==='complete')completeLake(true,'인어를 물리치고 호수를 빠져나왔습니다.');else if(after==='collapse')completeLake(false,'뱉는 인어와의 전투 후 붕괴하는 호수에서 탈출했습니다.');else{state.scene='event';sync();}return;}sync();}
function fleeBattle(){if(busy||state.scene!=='battle'||!state.battle)return;const b=state.battle;const p=b.type==='whale'?.64:.72;if(Math.random()>=p){takeDamage(b.type==='whale'?25:12,8);log('전투 중 도주에 실패했습니다.');if(!safeCheck())return;sync();return;}state.battle=null;log(b.name+'에게서 벗어났습니다.');if(b.type==='whale'){afterWhale(b.index);}else if(b.after==='complete'||b.after==='collapse')completeLake(false,'전투를 포기하고 호수 밖으로 빠져나왔습니다.');else{state.scene='event';sync();}}
function button(text,act,value='',cls='',disabled=false){return '<button class="'+cls+'" data-act="'+act+'" data-value="'+esc(value)+'" '+(disabled?'disabled':'')+'>'+esc(text)+'</button>';}
function tag(t){return '<span class="chip">'+esc(t)+'</span>';}
function renderSide(){const stats=[['선장 등급',state.grade+'등급'],['소지 자금 (크레딧)',String(state.gold)],['승선 인원',state.crew.length+' / '+GRADE_CAP[state.grade]],['접근 가능 호수',LAKE_CAP[state.grade]+' / 100'],['누적 통과',state.count.lake+'개'],['이번 출항',state.sea?state.visited.length+' / '+state.offered.length:'항구']];$('stats').innerHTML=stats.map(s=>'<div class="stat"><small>'+s[0]+'</small><strong>'+s[1]+'</strong></div>').join('');$('meters').innerHTML=[['선체 내구도',state.hull,100],['정신 상태',state.mind,100]].map(s=>'<div class="barline"><span>'+s[0]+'</span><span>'+s[1]+' / '+s[2]+'</span></div><div class="meter '+(s[1]<=30?'alert':'')+'"><span style="width:'+clamp(s[1],0,100)+'%"></span></div>').join('');$('sidebarCrew').innerHTML=state.crew.length?state.crew.map(c=>'<div class="inset"><b>'+ROLE[c.role].name+'</b><span class="muted"> · 전투력 '+ROLE[c.role].power+'</span><br><small class="'+['good','normal','bad','worst'][c.condition]+'">'+CONDITIONS[c.condition]+'</small></div>').join(''):'<div class="inset warning">승선한 선원이 없습니다.</div>';$('logs').textContent=state.log.slice(0,10).join('\n\n');}

function renderPlay(){const s=state.scene;if(s==='start')return '<div class="inset"><div class="small">초기 플레이</div><h2>항구에 선 당신</h2><p>당신은 1등급 선장입니다. 작은 배 한 척과 하급 선원 한 명을 데리고 U사의 항구에서 출발하려 합니다. 호수의 규칙은 문자로 남길 수 없어, 뱃사람들의 말로만 전해집니다.</p><p class="muted">죽음은 모든 진행을 초기화합니다. 살아서 귀환하면 출항을 거듭하고, 등급과 선원 규모를 키울 수 있습니다.</p>'+button('항구에서 준비 시작','enterPort','','primary')+'</div>';
if(s==='port'){const next=state.grade+1;return '<div class="inset"><div class="small">항구 · 안전 구역</div><h2>다음 출항 준비</h2><p>10가지 색상 계열을 각기 10가지 질감으로 나눈 100개의 호수 중 선장 등급에 따라 이번 항해에서 접근할 수 있는 구역이 무작위로 정해집니다. 재앙의 고래 다섯 마리 역시 매 출항마다 서로 다른 호수로 이동합니다.</p>'+button('새 출항 준비','prepare','','primary')+'</div><div class="inset"><h3>항구 시설</h3><p class="muted">선원 모집 및 승급은 위의 선원·승급 탭에서 진행할 수 있습니다.</p>'+button('선원 모집·승급 보기','tab','crew')+'</div><div class="inset"><h3>승급 현황</h3><p>통과 횟수 '+state.xp+'회 '+(next<=5?'/ 다음 등급 조건 '+RANK_XP[next]+'회':'/ 최고 등급')+'</p></div>';}
if(s==='prep')return '<div class="inset"><div class="small">U사 출항 전 · 구전</div><h2>선원이 전하는 이야기</h2><p>항구에서 뱃사람들의 전언을 <b>무작위로 3개</b> 들을 수 있습니다. 그중 적어도 1개는 사실이며, 돈과 선장 등급이 높을수록 사실을 들을 가능성이 증가합니다. 참과 거짓은 표시되지 않습니다.</p><p class="muted">이야기는 이번 출항 중에만 제공됩니다. 호수의 규칙을 기록물로 남기지 않습니다.</p>'+(state.rumorBought?'<div class="stack">'+state.rumors.map((r,i)=>'<div class="rumor"><div class="small">전언 '+(i+1)+' · '+esc(LAKES[r.lake-1].name)+'</div>“'+esc(r.text)+'”</div>').join('')+'</div>':'<div class="stack">'+button('일반 정보 듣기 · 무료','rumor','0')+button('술값 20 크레딧 지불','rumor','20','',state.gold<20)+button('상급 정보료 50 크레딧 지불','rumor','50','primary',state.gold<50)+'</div>')+'<div class="row" style="margin-top:14px">'+button('출항하기','launch','','primary')+'</div></div><div class="inset"><h3>이번 항해에서 접근할 호수</h3><p class="muted">출항 후 목록을 확인할 수 있습니다. 다섯 재앙의 위치는 공개되지 않습니다.</p>'+tag('접근 구역 '+state.offered.length+'개')+'</div>';
if(s==='route'){const list=state.offered.map(id=>{const l=LAKES[id-1],seen=state.visited.includes(id);return '<div class="lake '+(seen?'locked':'')+'" style="border-left:5px solid '+l.hex+'"><div class="between"><span class="tag">제'+String(id).padStart(3,'0')+'호</span>'+tag('위험도 '+l.risk)+'</div><h3>'+esc(l.name)+'</h3><p class="muted">'+(l.mermaid?'인어가 출몰할 수 있는 구역':'불분명한 수면과 미확인 위험')+' · 예상 체류 '+l.limit+'턴</p>'+button(seen?'탐사 완료':'이 호수로 항해','lake',id,'primary',seen)+'</div>';}).join('');return '<div class="inset"><div class="between"><h2>이번 출항의 호수</h2>'+tag(state.visited.length+' / '+state.offered.length+' 통과·이탈')+'</div><p class="muted">선장의 등급에 해당하는 '+state.offered.length+'개의 호수를 100개 중 무작위로 배정했습니다. 모든 호수가 연속 항해로 이어질 수 있습니다.</p>'+button('항구로 귀환','return')+'</div><div class="lakegrid">'+list+'</div>';}
if(s==='encounter'){const k=state.encounter,w=WHALES[k];return '<div class="inset warning"><div class="small">경고 · 5재앙의 고래</div><h2>'+esc(w.name)+'</h2><p>'+esc(w.description)+'</p><p class="muted">사냥 난이도 측정 불가. 현명한 선택은 도주입니다.</p>'+tag('현재 선체 '+state.hull+' / 100')+' '+tag('아군 전투력 '+crewPower())+'<div class="stack" style="margin-top:14px">'+button('즉시 회피한다','escapeWhale','','primary')+button('재앙의 고래를 사냥한다','huntWhale','','danger')+'</div></div>';}
if(s==='special'){const k=state.specialPending,w=WHALES[k],possible=canHuntSpecial();return '<div class="inset warning"><div class="small">특이한 인어 조우</div><h2>'+esc(w.mermaid)+'</h2><p>'+esc(w.name)+'을 따르는 인어가 뱃머리 앞에 나타났습니다.</p><p class="muted">사냥 가능 조건: 3등급 이상의 선장 + 작살잡이 + 1등 항해사 + 일반 선원(하급·중급·상급)이 모두 승선해야 합니다.</p>'+tag(possible?'사냥 자격 충족':'사냥 자격 부족')+'<div class="stack" style="margin-top:14px">'+button('사냥을 시도한다','specialBattle','','primary',!possible)+button('인어를 피해 이동한다','avoidSpecial')+'</div></div>';}
if(s==='event'){const l=activeLake();if(!l)return '<div class="inset">호수 정보를 찾을 수 없습니다.</div>';const law=lakeLaw(l),z=lakeZone(l);const seen=state.lakeRumorTruth?law.truth(z):law.false(z);return '<div class="inset" style="border-top:4px solid '+l.hex+'"><div class="between"><h2>구역: '+esc(l.name)+'</h2>'+tag('색상 '+COLOR_GROUPS[l.hue].label)+' '+tag('창작 구역')+'</div><div class="inset"><div class="barline"><span>호수 상태</span><span>체류 1 / '+l.limit+'턴</span></div><div class="meter"><span style="width:'+(100/l.limit)+'%"></span></div><div class="small">선원이 전하는 이야기 · 진위 불명</div><p>“'+esc(state.blueTorn?'이곳의 호수가 찢어졌습니다. 지금은 어떤 전언도 믿기 어렵습니다.':seen)+'”</p></div><h3>발생 사건</h3><p>'+esc(law.event(z))+'</p>'+(state.ruleResolved?'<div class="result">'+esc(state.ruleResult)+'</div><div class="stack" style="margin-top:12px">'+button('다음으로','nextEvent','','primary')+'</div>':'<div class="stack">'+law.options.map((opt,i)=>button(opt,'rule',i)).join('')+'</div>')+'</div>';}
if(s==='battle'){const b=state.battle;if(!b)return '<div class="inset">전투 정보가 없습니다.</div>';const numeric=b.type!=='whale';return '<div class="inset warning"><div class="small">해상 전투</div><h2>'+esc(b.name)+'</h2><p>아군 전투력: <b>'+crewPower()+'</b> / 적 전투력: <b>'+b.power+'</b><br>'+(numeric?'동전 앞면 확률: <b>'+pct(combatChance())+'</b>':'재앙의 고래: <b>사냥 난이도 측정 불가</b>')+'</p><p>유효 타격: <b>'+b.won+' / '+b.need+'</b></p><div class="coinpanel" id="coinPanel"><div class="small">앞면: 타격 성공 · 뒷면: 적의 반격</div><div class="coinstage"><div class="coin" id="coin"><div class="face">앞면</div><div class="face back">뒷면</div></div></div><p id="coinText">'+esc(state.lastCoin||'동전을 직접 던져 공격을 판정하십시오.')+'</p>'+button('동전 던지기','coin','','primary')+'</div><div class="stack" style="margin-top:12px">'+button('전투에서 도망친다','flee')+'</div><p class="muted">전투력 비교에 따라 앞면 확률이 계산됩니다. 동전이 실제로 회전한 후 승패가 적용됩니다.</p><div class="log">'+esc(b.history.slice(-6).join('\n'))+'</div></div>';}
return '<div class="inset">알 수 없는 장면입니다. '+button('항구로 돌아가기','enterPort')+'</div>';}
function renderCrew(){let html='<div class="inset"><h2>선원 명부 · 승급</h2><p>선장의 기본 전투력 '+(20+state.grade*8)+' / 선원 포함 실제 전투력 <b>'+crewPower()+'</b></p><p class="muted">선원이 나쁨 또는 최악 상태가 되면 인어로 변할 수 있습니다. 컨디션에 따라 전투력도 줄어듭니다.</p>';html+=state.crew.map(c=>'<div class="inset crew"><div><b>'+esc(ROLE[c.role].name)+'</b><small>전투력 기본 '+ROLE[c.role].power+' · 상태 <span class="'+['good','normal','bad','worst'][c.condition]+'">'+CONDITIONS[c.condition]+'</span></small></div></div>').join('');html+='</div>';html+='<div class="inset"><h3>등급 상승</h3>';if(state.grade<5){const n=state.grade+1;html+='<p>'+n+'등급 요구: 통과 '+RANK_XP[n]+'회 / '+RANK_COST[n]+' 크레딧<br><span class="muted">현재 통과 '+state.xp+'회 · 보유 '+state.gold+' 크레딧</span></p>'+button(n+'등급 승급','promote','','primary',state.sea||state.scene!=='port'||state.gold<RANK_COST[n]||state.xp<RANK_XP[n]);}else html+='<p>최고 5등급에 도달했습니다.</p>';html+='</div><div class="inset"><h3>선원 모집</h3><p class="muted">현재 최대 '+GRADE_CAP[state.grade]+'명. 선장은 인원수에 포함하지 않습니다. 모든 모집과 정비는 항구에서만 가능합니다.</p><div class="stack">';for(const [key,r] of Object.entries(ROLE)){html+=button(r.name+' · 전투력 '+r.power+' · '+r.cost+' 크레딧 ('+r.grade+'등급 이상)','recruit',key,'',state.sea||state.scene!=='port'||state.gold<r.cost||state.grade<r.grade||state.crew.length>=GRADE_CAP[state.grade]);}html+='</div></div><div class="inset"><h3>정비·휴식</h3><div class="stack">'+button('선체 +35 수리 · 35 크레딧','repair','','',state.sea||state.scene!=='port'||state.gold<35||state.hull>=100)+button('선원 컨디션 한 단계 회복 · 20 크레딧','rest','','',state.sea||state.scene!=='port'||state.gold<20||!state.crew.some(c=>c.condition>0))+'</div></div>';return html;}
function renderAch(){const order=['common','rare','hero','legend','myth','miracle','unique'];let h='<div class="inset"><h2>업적 보관함</h2><p class="muted">카테고리별 전용 테두리로 구분됩니다. 업적 역시 목숨에 귀속되어 사망 시 모두 초기화됩니다.</p>'+tag('달성 '+state.achievements.length+' / '+ACH.length)+'</div>';for(const tier of order){h+='<h3>'+TIER[tier]+'</h3><div class="achgrid">';for(const a of ACH.filter(x=>x.tier===tier)){const done=state.achievements.includes(a.id);h+='<div class="achievement '+tier+(done?'':' unearned')+'"><div class="tier">'+TIER[tier]+' · '+(done?'달성':'미달성')+'</div><b>'+esc(a.name)+'</b><p class="muted">'+esc(a.desc)+'</p></div>';}h+='</div>';}return h;}
function renderHelp(){return '<div class="inset"><h2>항해 안내 · v0.1.1 · 색상 규칙 개편</h2><p>전체 호수는 100개(10가지 색상 계열 × 10가지 질감)이며, 비슷한 색상이라도 반드시 해야 할 행동과 절대 하면 안 되는 행동이 뒤바뀔 수 있습니다. 특히 제017호 붉은 물감 호수는 피 한 방울이 필요하고, 제039호 붉은 가루 호수는 피를 떨어뜨려서는 안 됩니다.</p><p>전체 호수는 100개이며, 등급별로 <b>4 / 6 / 10 / 20 / 30개</b>가 무작위로 열립니다. 매 출항마다 다섯 재앙의 고래는 100개 중 중복 없는 임의의 호수에 배치됩니다.</p><p>선원은 하급, 중급, 상급, 작살잡이, 1등 항해사로 분류됩니다. 3등급 이상이며 작살잡이, 1등 항해사, 일반 선원이 모두 승선한 경우 특수 인어 사냥이 가능합니다.</p><p>전투력은 선장 기본 전투력과 선원 전투력을 합산하되, 상태가 악화한 선원은 실제 전투력이 감소합니다. 전투력의 비율에 따라 동전 앞면이 나올 확률이 달라지고, 앞면이면 타격 성공, 뒷면이면 반격을 받습니다. 재앙의 고래는 확률을 공개하지 않습니다.</p><p>출항 전 들은 세 가지 이야기는 최소 한 개가 사실이지만 어느 것이 참인지는 알 수 없습니다. 각 호수의 숨겨진 실제 금기는 고정되어 있으며, 같은 금기를 위반하면 같은 종류의 위험이 발생합니다.</p><p class="muted">호수 이름과 사건 대부분은 비공식 창작물입니다. 다섯 재앙 이름과 특수 인어 명칭은 이번 업데이트 요청을 따릅니다.</p><p>자동 저장은 현재 기기의 브라우저에만 보관됩니다. 사망하면 업적을 포함한 진행이 완전히 삭제됩니다.</p></div>';}
document.addEventListener('click',e=>{const b=e.target.closest('button[data-act]');if(!b||b.disabled||busy)return;const act=b.dataset.act,v=b.dataset.value;switch(act){case 'tab':tab=v;render();break;case 'enterPort':state.scene='port';sync();break;case 'prepare':prepareVoyage();break;case 'rumor':buyRumor(Number(v));break;case 'launch':launch();break;case 'return':returnPort();break;case 'lake':selectLake(Number(v));break;case 'rule':chooseRule(Number(v));break;case 'nextEvent':nextEvent();break;case 'escapeWhale':escapeWhale();break;case 'huntWhale':huntWhale();break;case 'avoidSpecial':avoidSpecial();break;case 'specialBattle':startSpecial();break;case 'coin':throwCoin();break;case 'flee':fleeBattle();break;case 'promote':promote();break;case 'recruit':recruit(v);break;case 'repair':repair();break;case 'rest':rest();break;case 'restart':sync();break;}});
render();

</script>
</body>
</html>
