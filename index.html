<script>
'use strict';
/* 대호수 - 항해의 나폴리탄 v0.1.1 · 색상 규칙 개편 색상 규칙 개편. 10개 색상군 × 10개 색상 질감. */
const GRADE_CAP=[0,1,3,5,7,10], LAKE_CAP=[0,4,8,12,16,20];
const RANK_XP=[0,0,4,10,20,36],RANK_COST=[0,0,90,220,450,850];
const ROLE={lower:{name:'하급 선원',power:9,cost:32,grade:1},middle:{name:'중급 선원',power:15,cost:65,grade:2},upper:{name:'상급 선원',power:23,cost:115,grade:3},harpoon:{name:'작살잡이',power:31,cost:145,grade:3},navigator:{name:'1등 항해사',power:25,cost:175,grade:3}};
const CONDITIONS=['좋음','보통','나쁨','최악'];
/* 100개 호수: 10가지 색상군 x 10가지 질감. 호수마다 행동 금기를 독립적으로 갖습니다. */
const COLOR_GROUPS=[
 {label:'붉은',hex:'#a74452',topic:'피',doText:'피 한 방울을 수면에 떨어뜨린다',noText:'피를 한 방울도 떨어뜨리지 않는다',verb:'피 한 방울을 수면에 떨어뜨리는 행위',question:'피를 한 방울 떨어뜨려야 합니까?',danger:'붉은 물속에서 사람의 팔과 닮은 것이 솟구칩니다.'},
 {label:'푸른',hex:'#397fb2',topic:'종',doText:'종을 정확히 한 번 울린다',noText:'종을 전혀 울리지 않는다',verb:'종을 정확히 한 번 울리는 행위',question:'종을 한 번 울려도 되겠습니까?',danger:'물속에서 파도와 닮은 울음소리가 돌아옵니다.'},
 {label:'초록',hex:'#568b60',topic:'해초',doText:'뱃전에 걸린 해초를 잘라낸다',noText:'해초를 자르지 않고 둔다',verb:'뱃전에 걸린 해초를 잘라내는 행위',question:'해초를 잘라 버릴까요?',danger:'물비늘을 두른 손들이 선체를 기어오릅니다.'},
 {label:'황금',hex:'#b49b45',topic:'동전',doText:'동전 하나를 수면에 띄운다',noText:'동전을 수면에 놓지 않는다',verb:'동전 하나를 수면에 띄우는 행위',question:'동전 한 개를 물 위에 올릴까요?',danger:'금속을 씹는 듯한 소리가 선저에서 울립니다.'},
 {label:'백색',hex:'#d1d4d5',topic:'등불',doText:'선미의 등불을 잠시 끈다',noText:'선미의 등불을 계속 켜 둔다',verb:'선미의 등불을 끄는 행위',question:'선미의 등불을 꺼야 합니까?',danger:'백색 수면에서 눈이 없는 형상이 떠오릅니다.'},
 {label:'검은',hex:'#343743',topic:'얼굴',doText:'선원들의 얼굴을 천으로 가린다',noText:'얼굴을 가리지 않는다',verb:'선원들의 얼굴을 천으로 가리는 행위',question:'얼굴을 천으로 가릴까요?',danger:'수면의 검은 그림자가 갑판 위에 매달립니다.'},
 {label:'보랏빛',hex:'#8a60a3',topic:'거울',doText:'손거울로 수면을 비춰 본다',noText:'거울을 꺼내지 않는다',verb:'손거울로 수면을 비추는 행위',question:'손거울로 수면을 비춰도 됩니까?',danger:'거울 속 인영이 배의 반대편에서 일어섭니다.'},
 {label:'청록',hex:'#429e9c',topic:'손짓',doText:'오른손을 들어 두 차례 신호한다',noText:'손짓으로 신호하지 않는다',verb:'오른손으로 두 차례 신호하는 행위',question:'오른손으로 신호를 보낼까요?',danger:'청록색 물결에서 낯선 손들이 일제히 흔들립니다.'},
 {label:'잿빛',hex:'#80888c',topic:'쇠못',doText:'쇠못 한 개를 선실 바닥에 박는다',noText:'쇠못을 새로 박지 않는다',verb:'쇠못 한 개를 선실 바닥에 박는 행위',question:'새 쇠못을 박아도 되겠습니까?',danger:'수면 아래서 철을 긁는 무리가 모여듭니다.'},
 {label:'주황',hex:'#bf7850',topic:'돛',doText:'주돛을 절반까지 내린다',noText:'주돛을 그대로 펼쳐 둔다',verb:'주돛을 절반까지 내리는 행위',question:'주돛을 절반만 내릴까요?',danger:'주황색 거품이 끓고 불붙은 비늘이 솟아오릅니다.'}
];
const MATERIALS=[
 {label:'물감',omen:'마치 풀어 놓은 물감처럼 색이 수면에 번지고 있습니다.',qualifier:'색이 진해지는 첫 순간'},
 {label:'가루',omen:'곱게 부서진 가루가 물 위에 내려앉아 있습니다.',qualifier:'가루가 갑판에 닿기 전'},
 {label:'안개',omen:'수면 바로 위로 낮은 안개가 깔리고 있습니다.',qualifier:'안개가 뱃머리를 감쌀 때'},
 {label:'진주',omen:'반들거리는 진주 같은 알갱이가 군데군데 떠오릅니다.',qualifier:'첫 진주가 수면 위로 떠오를 때'},
 {label:'잉크',omen:'잉크 같은 띠가 선체 옆을 따라 번집니다.',qualifier:'잉크 띠가 선체와 나란해질 때'},
 {label:'유리',omen:'유리 같은 얇은 조각이 수면 위를 지나갑니다.',qualifier:'유리 조각이 빛을 반사할 때'},
 {label:'소금',omen:'소금 결정처럼 빛나는 가루가 물살을 뒤덮습니다.',qualifier:'소금 결정이 소리를 낼 때'},
 {label:'수초',omen:'빛깔을 띤 수초가 뱃전 가까이 떠오릅니다.',qualifier:'수초가 선체에 닿을 때'},
 {label:'물결',omen:'주변 물결이 같은 빛깔로 변해 갑니다.',qualifier:'세 번째 물결이 도착할 때'},
 {label:'산호',omen:'색을 띤 산호 가지가 물 아래에서 고개를 듭니다.',qualifier:'산호가 물 밖으로 드러날 때'}
];
const ZONES=COLOR_GROUPS;
/* 번호는 출항마다 바뀌지 않습니다. 17·39호는 요청한 두 붉은 호수로 고정합니다. */
const fixedLakeEntries={17:{hue:0,material:0},39:{hue:0,material:1}};
const entries=[];
for(let hue=0;hue<COLOR_GROUPS.length;hue++)for(let material=0;material<MATERIALS.length;material++){
 if(hue===0&&(material===0||material===1))continue;
 entries.push({hue,material});
}
let stableSeed=0x51adbef1;
function stableRandom(){stableSeed=(Math.imul(stableSeed,1664525)+1013904223)>>>0;return stableSeed/4294967296;}
for(let i=entries.length-1;i>0;i--){let j=Math.floor(stableRandom()*(i+1));[entries[i],entries[j]]=[entries[j],entries[i]];}
const LAKES=[], RULES=[];
for(let id=1;id<=100;id++){
 const variant=fixedLakeEntries[id]||entries.shift();
 const hue=variant.hue,material=variant.material,z=COLOR_GROUPS[hue],m=MATERIALS[material];
 const required=(id===17)?true:(id===39)?false:((hue*3+material*5+Math.floor(id/7))%2===0);
 const name=z.label+' '+m.label+' 호수';
 const l={id,name,hue,material,zone:hue,rule:id-1,risk:1+(id*17+3)%4,limit:2+(id*7)%4,mermaid:(id*13+7)%10<4,hex:z.hex,required};
 LAKES.push(l);
 const norm='이 호수에서 '+m.qualifier+'에는 ';
 const truth=required?norm+z.verb+'가 반드시 필요하다.':norm+z.verb+'를 절대로 해서는 안 된다.';
 const falseRule=required?norm+z.verb+'를 하면 인어가 나타난다.':norm+z.verb+'를 해야 무사히 지나갈 수 있다.';
 RULES.push({title:z.label+' '+m.label+' 계열의 항해 규칙',truth:()=>truth,false:()=>falseRule,
  event:()=>m.omen+' 선원은 묻습니다. “'+z.question+'”',
  options:[z.doText,z.noText,'멈추지 않고 주변을 살피며 속력을 늦춘다'],effects:required?['good','bad','neutral']:['bad','good','neutral'],
  special:id===39?'blood_mermaid':null});

try{const saved=JSON.parse(localStorage.getItem(SAVE_KEY));if(saved && [1,2,3].includes(saved.version) && saved.state && saved.state.grade>=1 && saved.state.grade<=5){state=saved.state;if(saved.version===1){state.scene='port';state.sea=false;state.current=null;state.offered=[];state.visited=[];state.whalePlaces={};state.rumors=[];state.battle=null;state.encounter=null;state.ruleResolved=false;state.ruleResult='';state.forceMermaid=false;state.rumorBought=false;}else if(state.scene==='battle'&&!state.battle)state.scene='route';}}catch(e){console.warn('저장 데이터 복구 실패:',e);}
state.achievements=[...new Set([...permanentAchievements,...(Array.isArray(state.achievements)?state.achievements:[])])].filter(id=>ACH.some(a=>a.id===id));
const $=id=>document.getElementById(id);
const esc=str=>String(str).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const rng=n=>Math.floor(Math.random()*n);
const shuffle=a=>{const b=[...a];for(let i=b.length-1;i>0;i--){const j=rng(i+1);[b[i],b[j]]=[b[j],b[i]];}return b;};
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const pct=n=>Math.round(n*100)+'%';
function save(){try{permanentAchievements=[...new Set([...permanentAchievements,...state.achievements])];localStorage.setItem(ACH_SAVE_KEY,JSON.stringify(permanentAchievements));localStorage.setItem(SAVE_KEY,JSON.stringify({version:3,state}));}catch(e){console.warn('저장 실패',e);}}
function log(msg){state.log.unshift(msg);state.log=state.log.slice(0,18);}
function award(id){if(!state.achievements.includes(id)){state.achievements.push(id);const a=ACH.find(x=>x.id===id);if(a)log('업적 달성: '+a.name);}}
function trophies(){if(state.voyage>0)award('launch');if(state.count.return>0)award('return');if(state.count.rumors>0)award('rumor');if(state.count.lake>=5)award('lake5');if(state.count.lake>=20)award('lake20');if(state.grade>=3)award('rank3');if(state.grade>=5)award('rank5');if(state.count.special>0)award('special');if(state.whaleKilled.length>=1)award('whale1');if(state.whaleKilled.length>=3)award('whale3');if(state.whaleKilled.length===5)award('all5');}
function setScene(s){state.scene=s;tab='play';sync();}
function sync(){trophies();save();render();}
function safeCheck(){if(state.hull<=0||state.mind<=0){die();return false;}return true;}
function die(){const earned=[...new Set([...permanentAchievements,...state.achievements])];state=fresh();state.achievements=earned;state.scene='dead';tab='play';save();render();}
function crewPower(){let n=20+state.grade*8;for(const c of state.crew){const scale=[1.15,1,.65,.3][c.condition];n+=Math.round(ROLE[c.role].power*scale);}return n;}
function crewHealth(){return state.crew.map(x=>CONDITIONS[x.condition]).join(', ');}
function decayCrew(){let msg=[];for(const c of [...state.crew]){if(Math.random()<.21)c.condition=Math.min(3,c.condition+1);const p=c.condition===2?.07:c.condition===3?.2:0;if(Math.random()<p){state.crew=state.crew.filter(x=>x.id!==c.id);msg.push(ROLE[c.role].name+'이(가) 인어로 변이해 사라졌습니다.');}}if(msg.length)log(msg.join(' '));return msg.join('\n');}
function injureCrew(n){state.crew.forEach(c=>c.condition=Math.min(3,Math.max(c.condition,n)));return decayCrew();}
function restCrew(){state.crew.forEach(c=>c.condition=Math.max(0,c.condition-1));}
function takeDamage(h,m){state.hull=Math.max(0,state.hull-h);state.mind=Math.max(0,state.mind-m);}
function activeLake(){return LAKES.find(l=>l.id===state.current);}
function lakeLaw(l){return RULES[l.rule];}
function lakeZone(l){return ZONES[l.zone];}
function prepareVoyage(){if(state.sea)return;const ids=shuffle(LAKES.map(x=>x.id));state.offered=ids.slice(0,LAKE_CAP[state.grade]);const positions=shuffle(LAKES.map(x=>x.id)).slice(0,5);state.whalePlaces={};positions.forEach((id,i)=>state.whalePlaces[id]=i);state.visited=[];state.lastTransition='';state.whaleSeen=[];state.rumors=[];state.rumorBought=false;state.current=null;state.scene='prep';sync();}
function buyRumor(cost){if(state.scene!=='prep'||state.rumorBought||state.gold<cost)return;state.gold-=cost;
const chance=cost===0?.4+state.grade*.06:cost===20?.65+state.grade*.045:.85+state.grade*.025;
const ids=shuffle(state.offered).slice(0,2);const truths=ids.map(()=>Math.random()<chance);
const hintTrue=Math.random()<chance;if(!hintTrue&&!truths.some(Boolean))truths[rng(truths.length)]=true;
const stories=ids.map((id,i)=>{const l=LAKES[id-1];return {lake:id,text:(truths[i]?lakeLaw(l).truth:lakeLaw(l).false)(lakeZone(l))};});
const whaleIds=Object.keys(state.whalePlaces).map(Number);
const outsiders=shuffle(LAKES.map(l=>l.id).filter(id=>!whaleIds.includes(id)));
const candidates=shuffle(hintTrue?[whaleIds[rng(whaleIds.length)],...outsiders.slice(0,2)]:outsiders.slice(0,3));
stories.push({lake:null,text:'다섯 재앙 중 하나를 제'+candidates.map(id=>String(id).padStart(3,'0')).join('호 · 제')+'호 중에서 봤다는 이야기가 있습니다.'});
state.rumors=shuffle(stories);state.rumorBought=true;state.count.rumors++;log('술집에서 전언 세 가지를 들었습니다. 진위는 알려지지 않았습니다.');sync();}
function launch(){if(state.scene!=='prep')return;state.voyage++;state.sea=true;state.scene='route';log('제 '+state.voyage+'차 출항. 이번에는 '+state.offered.length+'개 구역에 접근합니다.');sync();}
function returnPort(){if(!state.sea||busy||state.battle||state.encounter)return;state.sea=false;state.current=null;state.offered=[];state.visited=[];state.whalePlaces={};state.rumors=[];state.rumorBought=false;state.scene='port';state.count.return++;if(state.hull===1)award('survive3');log('항구로 무사히 돌아왔습니다. 선원과 배를 정비할 수 있습니다.');sync();}
function promote(){if(state.sea||state.grade>=5||state.scene!=='port')return;const next=state.grade+1;if(state.xp<RANK_XP[next]||state.gold<RANK_COST[next])return;state.gold-=RANK_COST[next];state.grade=next;log('선장 '+next+'등급으로 승급했습니다.');sync();}
function recruit(role){const r=ROLE[role];if(!r||state.sea||state.scene!=='port'||state.grade<r.grade||state.crew.length>=GRADE_CAP[state.grade]||state.gold<r.cost)return;state.gold-=r.cost;state.crew.push({id:state.nextCrew++,role,condition:1});log(r.name+' 한 명이 승선했습니다.');sync();}
function repair(){if(state.sea||state.scene!=='port'||state.gold<35||state.hull>=100)return;state.gold-=35;state.hull=Math.min(100,state.hull+35);log('선체를 정비했습니다.');sync();}
function rest(){if(state.sea||state.scene!=='port'||state.gold<20||!state.crew.some(c=>c.condition>0))return;state.gold-=20;restCrew();log('선원이 휴식을 취했습니다.');sync();}
function selectLake(id){if(!state.sea||state.scene!=='route'||!state.offered.includes(id)||state.visited.includes(id))return;state.current=id;state.scene='event';state.ruleResolved=false;state.ruleResult='';state.blueTorn=false;state.blackCollapse=false;state.mermaidResolved=false;state.forceMermaid=false;state.lakeRumorTruth=Math.random()<.58;const k=state.whalePlaces[id];if(k!==undefined && !state.whaleSeen.includes(k)){state.whaleSeen.push(k);state.encounter=k;state.scene='encounter';applyWhale(k);if(!safeCheck())return;}log(LAKES[id-1].name+'에 진입했습니다.');sync();}
function applyWhale(k){const w=WHALES[k];log('재앙 조우: '+w.name);if(k===0)state.hull=Math.max(1,Math.floor(state.hull/2));if(k===1)state.blueTorn=true;if(k===2)state.crew.forEach(c=>c.condition=Math.max(2,c.condition));if(k===3)takeDamage(9,5);if(k===4){state.crew.forEach(c=>c.condition=Math.max(c.condition,2));takeDamage(0,8);for(const c of [...state.crew]){if(Math.random()<.12){state.crew=state.crew.filter(x=>x.id!==c.id);log(ROLE[c.role].name+' 한 명이 해모의 영향으로 인어로 변했습니다.');}}} }
function escapeWhale(){if(state.scene!=='encounter'||state.encounter===null)return;const k=state.encounter;state.encounter=null;const fail=Math.random()<(k===3?.22:.12);if(fail){takeDamage(k===3?24:14,8);log('재앙에게서 벗어나는 동안 선박이 큰 손상을 입었습니다.');}else log('재앙의 시야에서 벗어났습니다.');if(!safeCheck())return;afterWhale(k);}
function huntWhale(){if(state.scene!=='encounter'||state.encounter===null)return;const k=state.encounter;state.encounter=null;beginBattle({type:'whale',index:k,name:WHALES[k].name,power:WHALES[k].power,need:WHALES[k].hits,won:0,history:[],after:'whale'});}
function afterWhale(k){const encounterMermaid=!!state.normalMermaidDraw&&!state.mermaidResolved;if(encounterMermaid)state.mermaidResolved=true;if(k===3){state.blackCollapse=true;if(encounterMermaid){specialMermaid(k);}else completeLake(false,'호수 자체가 집어삼켜지는 것을 피해 달아났습니다. 이 구역의 규칙을 조사할 수 없었습니다.');return;}if(k===1)state.blueTorn=true;if(encounterMermaid){specialMermaid(k);return;}state.scene='event';state.ruleResolved=false;sync();}
function canHuntSpecial(){const roles=state.crew.map(c=>c.role);return state.grade>=3&&roles.includes('harpoon')&&roles.includes('navigator')&&roles.some(x=>['lower','middle','upper'].includes(x));}
function specialMermaid(k){state.specialPending=k;state.scene='special';sync();}
function avoidSpecial(){if(state.scene!=='special')return;state.specialPending=null;takeDamage(7,4);if(!safeCheck())return;if(state.blackCollapse){completeLake(false,'뱉는 인어를 피해 붕괴하는 호수에서 탈출했습니다.');return;}state.scene='event';sync();}
function startSpecial(){if(state.scene!=='special'||!canHuntSpecial())return;const k=state.specialPending;state.specialPending=null;beginBattle({type:'special',index:k,name:WHALES[k].mermaid,power:120+k*14,need:2,won:0,history:[],after:state.blackCollapse?'collapse':'event'});}
function chooseRule(choice){if(state.scene!=='event'||state.ruleResolved)return;const l=activeLake();if(!l)return;state.ruleResolved=true;const effect=state.blueTorn?'torn':RULES[l.rule].effects[choice];if(effect==='torn'){state.ruleResult='청새치 고래가 호수의 규칙을 찢어 놓았습니다. 이 사건은 정상적인 판정을 받지 않습니다. \n선원들은 불안해합니다.';takeDamage(3,4);}else if(effect==='good'){state.ruleResult='위험한 행동을 막았습니다. 호수가 잠잠해집니다. 선원들은 간신히 안도의 숨을 내쉽니다.';state.gold+=8;}else if(effect==='neutral'){state.ruleResult='조심스레 처리했습니다. 큰 재해는 피했지만 선체와 선원들에게 부담이 남습니다.';takeDamage(6,3);}else{state.ruleResult='금기를 건드렸습니다. '+(RULES[l.rule].danger||COLOR_GROUPS[l.hue].danger);takeDamage(22+l.risk*3,9+l.risk*2);if(l.id===39&&choice===0){if(state.crew.length&&Math.random()<.5){const victim=state.crew[0];state.crew=state.crew.filter(c=>c.id!==victim.id);state.ruleResult+=' 피를 바친 '+ROLE[victim.role].name+'이(가) 인어로 변했습니다.';}else{state.forceMermaid=true;state.ruleResult+=' 수면 아래에서 인어가 올라옵니다.';}}}log(l.name+': '+state.ruleResult.replace(/\n/g,' ').slice(0,76));if(!safeCheck())return;sync();}
function nextEvent(){if(state.scene!=='event'||!state.ruleResolved)return;const l=activeLake();if(!l)return;if(state.forceMermaid){state.forceMermaid=false;state.mermaidResolved=true;beginBattle({type:'normal',name:'붉은 가루 호수의 인어',power:56+l.risk*18,need:1,won:0,history:[],after:'complete'});return;}if(l.mermaid&&!state.mermaidResolved&&Math.random()<(.13+l.risk*.07)){state.mermaidResolved=true;beginBattle({type:'normal',name:'대호수의 인어',power:35+l.risk*18,need:1,won:0,history:[],after:'complete'});return;}completeLake(true,'호수의 경계에서 벗어났습니다.');}
function completeLake(success,msg){const id=state.current;if(id===null)return;if(!state.visited.includes(id))state.visited.push(id);if(success){state.count.lake++;state.xp++;state.gold+=16+LAKES[id-1].risk*5;}const lost=decayCrew();state.current=null;state.ruleResolved=false;state.ruleResult='';state.blueTorn=false;state.blackCollapse=false;state.forceMermaid=false;state.encounter=null;state.specialPending=null;state.battle=null;state.lastTransition=Math.random()<.5?'물빛이 바뀌었다.':'물빛이 갈라졌다.';log(state.lastTransition+' '+msg+(lost?' '+lost:''));if(!safeCheck())return;state.scene='route';if(state.visited.length>=state.offered.length){state.sea=false;state.scene='port';state.count.return++;state.offered=[];state.rumors=[];if(state.hull===1)award('survive3');log('이번 출항의 접근 가능한 호수를 모두 지나 항구로 귀환했습니다.');}sync();}
function beginBattle(b){state.battle=b;state.scene='battle';state.lastCoin=null;busy=false;sync();}
function combatChance(){const b=state.battle;return clamp(crewPower()/(crewPower()+b.power),.025,.975);}
function throwCoin(){if(busy||state.scene!=='battle'||!state.battle)return;busy=true;const b=state.battle,win=Math.random()<combatChance();const coin=$('coin'),status=$('coinText'),button=document.querySelector('button[data-act="coin"]');if(!coin||!status||!button){busy=false;return;}button.disabled=true;status.textContent='회전 중... 동전이 수면 위로 솟아오릅니다.';coin.style.setProperty('--landing',win?'1440deg':'1620deg');coin.classList.remove('flipping');void coin.offsetWidth;coin.classList.add('flipping');setTimeout(()=>{if(state.battle!==b){busy=false;return;}resolveCoin(win);busy=false;},1500);}
function resolveCoin(win){const b=state.battle;if(!b)return;b.history.push(win?'앞면 · 유효 타격':'뒷면 · 공격 실패');if(win){b.won++;log(b.name+'에 타격 성공 ('+b.won+'/'+b.need+').');}else{const h=b.type==='whale'?28+rng(12):b.type==='special'?14+rng(8):7+rng(8);takeDamage(h,b.type==='whale'?12:5);log(b.name+'의 반격. 선체 피해 '+h);if(b.type!=='normal'&&state.crew.length){const c=state.crew[rng(state.crew.length)];c.condition=Math.min(3,c.condition+1);}}
 state.lastCoin=win?'앞면 · 승리':'뒷면 · 패배';if(!safeCheck())return;
 if(b.won>=b.need){state.gold+=b.type==='whale'?260:b.type==='special'?80:28;if(b.type==='whale'){if(!state.whaleKilled.includes(b.index))state.whaleKilled.push(b.index);log(b.name+' 사냥 성공!');const index=b.index;state.battle=null;afterWhale(index);return;}if(b.type==='special'){state.count.special++;log(b.name+' 사냥 성공!');}else log('인어를 물리쳤습니다.');const after=b.after;state.battle=null;if(after==='complete')completeLake(true,'인어를 물리치고 호수를 빠져나왔습니다.');else if(after==='collapse')completeLake(false,'뱉는 인어와의 전투 후 붕괴하는 호수에서 탈출했습니다.');else{state.scene='event';sync();}return;}sync();}
function fleeBattle(){if(busy||state.scene!=='battle'||!state.battle)return;const b=state.battle;const p=b.type==='whale'?.64:.72;if(Math.random()>=p){takeDamage(b.type==='whale'?25:12,8);log('전투 중 도주에 실패했습니다.');if(!safeCheck())return;sync();return;}state.battle=null;log(b.name+'에게서 벗어났습니다.');if(b.type==='whale'){afterWhale(b.index);}else if(b.after==='complete'||b.after==='collapse')completeLake(false,'전투를 포기하고 호수 밖으로 빠져나왔습니다.');else{state.scene='event';sync();}}
function button(text,act,value='',cls='',disabled=false){return '<button class="'+cls+'" data-act="'+act+'" data-value="'+esc(value)+'" '+(disabled?'disabled':'')+'>'+esc(text)+'</button>';}
function tag(t){return '<span class="chip">'+esc(t)+'</span>';}
function renderSide(){const stats=[['선장 등급',state.grade+'등급'],['소지 자금 (크레딧)',String(state.gold)],['승선 인원',state.crew.length+' / '+GRADE_CAP[state.grade]],['접근 가능 호수',LAKE_CAP[state.grade]+' / 100'],['누적 통과',state.count.lake+'개'],['이번 출항',state.sea?state.visited.length+' / '+state.offered.length:'항구']];$('stats').innerHTML=stats.map(s=>'<div class="stat"><small>'+s[0]+'</small><strong>'+s[1]+'</strong></div>').join('');$('meters').innerHTML=[['선체 내구도',state.hull,100],['정신 상태',state.mind,100]].map(s=>'<div class="barline"><span>'+s[0]+'</span><span>'+s[1]+' / '+s[2]+'</span></div><div class="meter '+(s[1]<=30?'alert':'')+'"><span style="width:'+clamp(s[1],0,100)+'%"></span></div>').join('');$('sidebarCrew').innerHTML=state.crew.length?state.crew.map(c=>'<div class="inset"><b>'+ROLE[c.role].name+'</b><span class="muted"> · 전투력 '+ROLE[c.role].power+'</span><br><small class="'+['good','normal','bad','worst'][c.condition]+'">'+CONDITIONS[c.condition]+'</small></div>').join(''):'<div class="inset warning">승선한 선원이 없습니다.</div>';$('logs').textContent=state.log.slice(0,10).join('\n\n');}
function render(){renderSide();document.querySelectorAll('[data-act="tab"]').forEach(el=>el.classList.toggle('active',el.dataset.value===tab));$('content').innerHTML=tab==='ach'?renderAch():tab==='crew'?renderCrew():tab==='help'?renderHelp():renderPlay();}
function renderPlay(){const s=state.scene;
if(s==='dead')return '<div class="inset warning"><h2>항해 종료</h2><p>선장 등급, 선원, 자금, 항해 진행은 초기화되었습니다.</p><p><b>달성한 업적은 그대로 남습니다.</b></p>'+button('처음부터 다시 시작','restart','','primary')+'</div>';

function normalize0131(){
 if(!state.count||typeof state.count!=='object')state.count={lake:0,return:0,special:0,rumors:0};
 if(!Array.isArray(state.crew))state.crew=[];
 state.crew.forEach(c=>{if(typeof c.name!=='string'||!c.name.trim())c.name=ROLE[c.role]?.name+' '+c.id;});
 if(!state.prog||typeof state.prog!=='object')state.prog={voyage:0,lake:0,fishSold:0,oilCollected:0,coinHeads:0,coinTails:0,mermaidKills:0,goldPeak:state.gold,perfectVoyage:0,fullCrewVoyage:0};
 if(!Number.isFinite(state.fish))state.fish=0;
 if(!Number.isFinite(state.oil))state.oil=0;
 if(!Array.isArray(state.clearedIds))state.clearedIds=[];
 if(!Array.isArray(state.achievements))state.achievements=[];
 if(!Number.isFinite(state.lossesThisVoyage))state.lossesThisVoyage=0;
 if(!state.nav||typeof state.nav!=='object')state.nav=null;
 if(!Number.isFinite(state.fishTries))state.fishTries=0;
 if(!Number.isFinite(state.routeChoiceCount))state.routeChoiceCount=(state.voyage>0&&state.visited?.length>0)?1:0;
 if(!state.scene)state.scene='start';
 if(state.scene==='event'&&state.current!=null&&state.nav===null){
  const old=LAKES[state.current-1];
  state.nav={stage:state.ruleResolved?'sail':'law',sight:false,helm:false,distance:0,
   target:2+(old&&old.risk>=3?1:0),turns:0,lawOk:!!state.ruleResolved,fished:false,transition:false};
 }
}

const oldTrophies0131=trophies;
trophies=function(){

 oldTrophies0131();
 state.prog.goldPeak=Math.max(state.prog.goldPeak||0,state.gold);
 const checks={
 voyage:state.voyage,lake:state.count.lake,fishSold:state.prog.fishSold,
 oilCollected:state.prog.oilCollected,coinHeads:state.prog.coinHeads,goldPeak:state.prog.goldPeak,
 mermaidKills:state.prog.mermaidKills,perfectVoyage:state.prog.perfectVoyage,fullCrewVoyage:state.prog.fullCrewVoyage
 };
 for(const a of ACH){if(!a.check)continue;
  const {kind,n}=a.check;
  const good=kind==='uniqueLake'?state.clearedIds.includes(n):(checks[kind]??0)>=n;
  if(good)award(a.id);
 }
};

 if(!state.nav)return;
 if(!state.nav.lawOk){
  if(state.forceMermaid&&!state.mermaidResolved){

   state.ruleResolved=false;

   beginBattle({type:'normal',name:'붉은 가루 호수의 인어',power:56+lake.risk*18,need:1,won:0,history:[],after:'navigation'});
   return;

  log('호수가 아직 잠잠해지지 않았습니다. 구역의 사건에 다시 대응해야 합니다.');
  sync();return;
 }
 state.nav.stage='sail';state.nav.turns++;
 state.ruleResult='사건에 대한 대응을 마쳤습니다. 그러나 아직 수역의 끝이 보이지 않습니다.';

};
function sailAction0131(action){
 if(state.scene!=='event'||!state.nav||!(state.nav.stage==='sail'||(action==='cross'&&state.nav.stage==='boundary')))return;
 const nav=state.nav,l=activeLake();
 if(!l)return;
 nav.turns++;
 if(action==='look'){
  if(nav.sight){log('이미 물의 가장자리에서 표식을 확인했습니다.');sync();return;}
  nav.sight=true;log('수면의 미세한 움직임에서 먼 경계의 조짐을 찾아냈습니다.');
 }else if(action==='helm'){
  nav.helm=true;log('선원과 협력해 키와 돛을 맞추었습니다.');
 }else if(action==='fish'){
  if(nav.fished){log('이 호수에서는 더 이상 물고기를 낚지 않습니다.');sync();return;}
  nav.fished=true;
  if(Math.random()<.68){
   const fish=1+rng(3);state.fish+=fish;
   log('물고기 '+fish+'마리를 낚았습니다. 항구에서 소액에 팔 수 있습니다.');
  }else{takeDamage(2,1);log('그물을 거두다가 물살에 선체가 스쳤습니다.');}
 }else if(action==='move'){
  if(!nav.sight||!nav.helm){
   takeDamage(5+Math.min(6,l.risk*2),2);
   log('항로를 확보하지 못한 채 전진했습니다. 선체에 부담이 생겼습니다.');
  }else{
   nav.distance++;
   log('확보된 방향으로 전진했습니다. 물가의 표시가 조금 더 가까워졌습니다.');
  }
  if(state.normalMermaidDraw&&!state.mermaidResolved){
   state.mermaidResolved=true;
   beginBattle({type:'normal',name:'대호수의 인어',power:35+l.risk*18,need:1,won:0,history:[],after:'navigation'});
   return;
  }
 }else if(action==='cross'){
  if(nav.stage!=='boundary'||!nav.sight||!nav.helm||nav.distance<nav.target)return;
  nav.transition=true;
  state.ruleResolved=true;
  completeLake(true,'호수의 경계를 넘었습니다.');
  return;
 }else return;
 if(nav.turns>l.limit+4){takeDamage(7+l.risk*3,5);log('체류 시간이 길어지자 이 수역의 파도가 선체를 거칠게 흔듭니다.');}
 if(nav.distance>=nav.target&&nav.sight&&nav.helm&&nav.lawOk){
  nav.stage='boundary';state.lastTransition=Math.random()<.5?'물빛이 바뀌었다.':'물빛이 갈라졌다.';
  log(state.lastTransition);
 }
 if(!safeCheck())return;
 sync();
}
const originalComplete0131=completeLake;
completeLake=function(success,msg){
 normalize0131();
 if(state.current!==null&&success&&state.nav&&!state.nav.transition){
  if(state.battle)state.battle=null;
  if(state.nav.stage==='law')state.nav.stage='sail';
  state.scene='event';
  log('급한 상황은 벗어났지만 아직 이 수역의 항해를 마치지 못했습니다.');
  sync();return;
 }
 const id=state.current;
 if(success&&id!==null){
  if(!state.clearedIds.includes(id))state.clearedIds.push(id);
  if(state.lossesThisVoyage===0&&state.visited.length+1===state.offered.length)state.prog.perfectVoyage++;
  if(state.crew.length===GRADE_CAP[state.grade]&&state.visited.length+1===state.offered.length)state.prog.fullCrewVoyage++;
 }
 originalComplete0131(success,msg);
 if(state.sea&&state.scene==='route')autoLake0131();
};
const oldResolve0131=resolveCoin;
resolveCoin=function(win){
 const prior=state.battle;
 const finished=!!prior&&win&&prior.won+1>=prior.need;
 oldResolve0131(win);
 if(!prior)return;
 normalize0131();
 if(win)state.prog.coinHeads++;
 else state.prog.coinTails++;
 if(finished){
  if(prior.type==='normal'||prior.type==='special'){
   const n=prior.type==='special'?2:1;
   state.oil+=n;state.prog.oilCollected+=n;state.prog.mermaidKills++;
   log('인어 사냥으로 고래기름 '+n+'개를 확보했습니다.');
  }else if(prior.type==='whale'){
   state.oil+=5;state.prog.oilCollected+=5;
   log('재앙의 고래에서 고래기름 5개를 확보했습니다.');
  }
 }
 state.prog.goldPeak=Math.max(state.prog.goldPeak,state.gold);
 sync();
};
const oldFlee0131=fleeBattle;
fleeBattle=function(){
 const prev=state.battle;
 if(prev&&prev.after==='navigation'&&state.scene==='battle'&&!busy){
  if(Math.random()<.72){
   state.battle=null;state.scene='event';
   log('인어를 피해 거리를 벌렸습니다. 항해를 다시 시작합니다.');
   sync();
  }else{takeDamage(12,8);log('도주 도중 인어가 배를 공격했습니다.');if(safeCheck())sync();}
  return;
 }
 oldFlee0131();
};
const oldRecruit0131=recruit;
recruit=function(role){
 const n=state.crew.length;oldRecruit0131(role);
 if(state.crew.length>n){const c=state.crew[state.crew.length-1];c.name=ROLE[c.role].name+' '+c.id;sync();}
};
function renameCrew0131(id){
 const c=state.crew.find(x=>x.id===id);if(!c)return;
 const field=document.getElementById('crewname_'+id);if(!field)return;
 const name=String(field.value||'').trim().replace(/\s+/g,' ');
 if(!name||name.length>16){alert('이름은 1~16글자로 입력해 주세요.');return;}
 c.name=name;log(ROLE[c.role].name+'의 이름을 '+name+'(으)로 정했습니다.');sync();
}
function sellFish0131(){
 if(state.sea||state.scene!=='port'||state.fish<=0)return;
 const sold=state.fish,earn=sold*4;state.gold+=earn;state.fish=0;
 state.prog.fishSold+=sold;state.prog.goldPeak=Math.max(state.prog.goldPeak,state.gold);
 log('물고기 '+sold+'마리를 판매해 '+earn+' 크레딧을 받았습니다.');sync();
}
const previousRenderPlay0131=renderPlay;
renderPlay=function(){
 if(state.scene==='start'){
  return previousRenderPlay0131()+'<div class="log-update"><h3>업데이트 내역 · V.0.1.3.1</h3><ul><li>출항 이후 자동 항해 방식과 호수별 인어 조우 확률 변경</li><li>선원·작살잡이·1등 항해사 이름 지정 기능</li><li>인어 사냥 보상으로 고래기름 추가 및 물고기 판매 기능</li><li>호수별 업적과 추가 업적, 등급별 업적 공개 방식 변경</li><li>사망 이후에도 업적 보관 유지</li></ul></div>';
 }
 if(state.scene==='port'){
  return previousRenderPlay0131()+'<div class="inset"><h3>어획물 거래</h3><p>보유 물고기 '+state.fish+'마리 · 판매가 한 마리당 4 크레딧</p>'+button('물고기 판매','sellFish','','primary',state.fish===0)+'</div>';
 }
 if(state.scene==='route'&&state.routeChoiceCount>0){
  /* 저장 데이터나 예외 경로로 재진입해도 다시 호수를 고르게 하지 않습니다. */
  if(state.sea&&state.offered.some(id=>!state.visited.includes(id)))return '<div class="inset"><h2>항로 재개</h2><p>다음 호수는 자동으로 정해집니다.</p>'+button('항해 계속','autoNext','','primary')+'</div>';
 }
 if(state.scene==='event'&&state.nav){
  const nav=state.nav,l=activeLake();
  if(nav.stage==='sail'||nav.stage==='boundary'){
   return '<div class="inset" style="border-top:4px solid '+l.hex+'"><div class="between"><h2>구역: '+esc(l.name)+'</h2>'+tag('창작 구역')+'</div><div class="inset"><div class="barline"><span>호수 체류</span><span>'+nav.turns+' / '+(l.limit+4)+'턴</span></div><div class="meter"><span style="width:'+Math.min(100,nav.turns/(l.limit+4)*100)+'%"></span></div><div class="small">항해 상황</div><p>'+esc(state.ruleResult||'사건에 대응했습니다.')+'</p></div><h3>호수 너머로 나아가기</h3><p>눈앞의 수면은 아직 끝나지 않았습니다. 선원과 주변 상황을 살펴 항로를 확보하십시오.</p><div class="stepbar"><span style="width:'+Math.min(100,100*nav.distance/nav.target)+'%"></span></div><p class="muted">전진 상황 '+nav.distance+' / '+nav.target+' · 주변 살피기 '+(nav.sight?'완료':'미완료')+' · 키 조정 '+(nav.helm?'완료':'미완료')+'</p>'+(nav.stage==='boundary'?'<div class="result">'+esc(state.lastTransition||'물빛이 갈라졌다.')+'</div><div class="stack">'+button('경계를 통과한다','sail','cross','primary')+'</div>':'<div class="stack">'+button('수면과 주변 표식을 살핀다','sail','look','',nav.sight)+button('키와 돛의 방향을 맞춘다','sail','helm','',nav.helm)+button('앞으로 항해한다','sail','move','primary')+button('물고기를 낚는다','sail','fish','',nav.fished)+'</div>')+'</div>';
  }
 }
 return previousRenderPlay0131();
};
const previousRenderCrew0131=renderCrew;
renderCrew=function(){
 let out=previousRenderCrew0131();
 const names=state.crew.map(c=>'<div class="inset"><b>'+esc(c.name||ROLE[c.role].name+' '+c.id)+'</b> · '+esc(ROLE[c.role].name)+'<div class="name-row"><input id="crewname_'+c.id+'" type="text" maxlength="16" value="'+esc(c.name||'')+'" placeholder="새 이름" aria-label="선원 이름 입력"><button data-act="renameCrew" data-value="'+c.id+'">이름 저장</button></div></div>').join('');
 return '<div class="inset"><h3>승선 인원 이름</h3><p class="muted">하급·중급·상급 선원, 작살잡이, 1등 항해사 모두 이름을 지을 수 있습니다.</p>'+names+'</div>'+out;
};
const previousRenderSide0131=renderSide;
renderSide=function(){
 previousRenderSide0131();
 const st=$('stats');if(st)st.innerHTML+='<div class="stat"><small>고래기름</small><strong>'+state.oil+'개</strong></div><div class="stat"><small>어획 물고기</small><strong>'+state.fish+'마리</strong></div>';
 const sidebar=$('sidebarCrew');
 if(sidebar)sidebar.innerHTML=state.crew.map(c=>'<div class="inset"><b>'+esc(c.name||ROLE[c.role].name+' '+c.id)+'</b><br><small>'+esc(ROLE[c.role].name)+' · '+CONDITIONS[c.condition]+'</small></div>').join('');
};
const previousRenderAch0131=renderAch;
renderAch=function(){
 const order=['common','rare','hero','legend','myth','miracle','unique'];
 let h='<div class="inset"><h2>업적 보관함</h2><p class="muted">영웅 이상 등급은 업적 이름만 공개하며 달성 조건은 표시되지 않습니다. 달성한 업적은 사망해도 유지됩니다.</p>'+tag('달성 '+state.achievements.length+' / '+ACH.length)+'</div>';
 for(const tier of order){
  h+='<h3>'+TIER[tier]+' · '+ACH.filter(a=>a.tier===tier).length+'종</h3><div class="achgrid">';
  for(const a of ACH.filter(x=>x.tier===tier)){
   const done=state.achievements.includes(a.id);
   h+='<div class="achievement '+tier+(done?'':' unearned')+'"><div class="tier">'+TIER[tier]+' · '+(done?'달성':'미달성')+'</div><b>'+esc(a.name)+'</b>'+(tier==='common'||tier==='rare'?'<p class="muted">'+esc(a.desc)+'</p>':'')+'</div>';
  }
  h+='</div>';
 }
 return h;
};
document.addEventListener('click',ev=>{
 const b=ev.target.closest('button[data-act]');if(!b||b.disabled||busy)return;
 if(b.dataset.act==='renameCrew')renameCrew0131(Number(b.dataset.value));
 if(b.dataset.act==='sellFish')sellFish0131();
 if(b.dataset.act==='sail')sailAction0131(b.dataset.value);
 if(b.dataset.act==='autoNext')autoLake0131();
});

if(state.scene==='route'&&state.sea&&state.routeChoiceCount>0)autoLake0131();else render();

</script>
