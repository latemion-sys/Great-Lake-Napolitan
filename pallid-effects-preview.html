<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>모든 것을 삼키는 창백한 고래 · 사냥 이펙트 시연 2차 개선</title>
<link rel="stylesheet" href="./pallid-cinematic-v2.css?v=01513">
<link rel="stylesheet" href="./pallid-v3.css?v=mg1029b">
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
body{background:radial-gradient(ellipse at 45% 0%,#263941,#0c141e 49%,#080b13 100%);font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif;color:#e7eef0;line-height:1.65;margin:0}
main{max-width:1110px;margin:auto;padding:36px 18px 72px}
h1{font-size:29px;letter-spacing:-.04em;margin:6px 0 8px}
p{margin:5px 0 15px}.eyebrow{font-size:12px;letter-spacing:.18em;color:#afced0}
.subtitle{color:#b4c1ca;font-size:14px}
.tabs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin:23px 0 12px}
button{font:inherit;cursor:pointer;font-size:13px;line-height:1.5;background:#172730;color:#bbcfd6;padding:12px;border:1px solid #3e5560;border-radius:10px}
button:hover{background:#28414e}
button:focus-visible{outline:3px solid #a0d3dd;outline-offset:2px}
.tabs button[aria-pressed="true"]{color:#faffff;background:#2b5664;border-color:#9bd0d6;box-shadow:inset 0 -3px #80b7bc}
.tabs button[aria-pressed="false"]{opacity:.85}
.viewer{background:linear-gradient(120deg,#192832,#152029);border:1px solid #455b65;border-radius:17px;padding:19px;box-shadow:0 24px 70px #0005}
#stage .pallid-cine-v2{margin:0;height:clamp(270px,47vw,485px);border-color:#79939b}
.controls{display:flex;justify-content:space-between;align-items:center;gap:13px;margin-top:15px;flex-wrap:wrap}
.meta h2{font-size:19px;letter-spacing:-.03em;margin:0 0 2px}
.meta p{font-size:13px;color:#a4bbc1;margin:0}
.actions{display:flex;gap:7px}
.actions button{padding:9px 14px;white-space:nowrap}
.actions .primary{background:#315f6d;color:white;border-color:#78abb5}
.help{margin-top:16px;font-size:12px;color:#90a8b3}
.load-error{padding:20px;color:#ffcbc4;background:#421c24;border:1px solid #a94d57;border-radius:12px}
.stage-placeholder{display:flex;align-items:center;justify-content:center;min-height:330px;background:#101e29;color:#b1bdc4;border:1px dashed #617582;border-radius:10px}
@media(max-width:650px){main{padding:21px 11px 50px}.tabs{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.tabs button{padding:8px 5px;font-size:11px}.viewer{padding:10px}.actions button{font-size:12px}h1{font-size:23px}#stage .pallid-cine-v2{height:clamp(200px,60vw,275px)}}
@media(prefers-reduced-motion:reduce){.help::after{content:" (기기 설정에 따라 움직임이 제한될 수 있습니다.)"}}
</style>
</head>
<body>
<main>
<div class="eyebrow">대호수 · 모든 것을 삼키는 창백한 고래 · CSS 시네마틱</div>
<h1>사냥 이펙트 실시간 미리보기</h1>
<p class="subtitle">다섯 장면을 직접 선택하고, 멈추거나 다시 재생할 수 있습니다. 애니메이션은 벡터 그림과 스타일시트만으로 구현했습니다.</p>
<nav class="tabs" id="scene-tabs" aria-label="장면 선택">
<button type="button" data-scene="harpoon" aria-pressed="true">1 · 작살 공격</button>
<button type="button" data-scene="ingest" aria-pressed="false">2 · 위장 진입</button>
<button type="button" data-scene="acid" aria-pressed="false">3 · 위산 통과</button>
<button type="button" data-scene="search" aria-pressed="false">4 · 심장 탐색</button>
<button type="button" data-scene="victory" aria-pressed="false">5 · 심장 파괴</button>
</nav>
<section class="viewer" aria-label="이펙트 영상">
<div id="stage" aria-live="off"><div class="stage-placeholder">애니메이션을 불러오는 중입니다.</div></div>
<div class="controls">
<div class="meta"><h2 id="scene-title">작살 공격</h2><p id="scene-desc">작살이 고래의 외피에 닿습니다.</p></div>
<div class="actions">
<button class="primary" id="replay" type="button">처음부터 재생 ↻</button>
<button id="pause" type="button" aria-pressed="false">일시 정지</button>
</div>
</div>
</section>
<p class="help">시연에서는 모든 장면이 반복 재생됩니다. 실제 게임에서는 해당 사건이나 전투에 도달했을 때 장면이 자동으로 나타납니다. 기기의 동작 최소화 설정이 켜져 있으면 움직임이 제한됩니다.</p>
</main>
<script src="./whale-marks.js?v=wm1030"></script>
<script src="./harpoon-launcher.js?v=reel1031"></script>
<script src="./pallid-cinematic-v2.js?v=whale1029"></script>
<script src="./pallid-cinematic-v3.js?v=reel1031"></script>
<script src="./pallid-v3-ingest.js?v=wm1030"></script>
<script src="./pallid-v3-acid.js?v=acid1030"></script>
<script src="./pallid-v3-heart.js?v=reel1031"></script>
<script src="./pallid-v3-victory.js?v=shot1030"></script>
<script>
(function(){
'use strict';
var lib=window.PallidCinematicV2;
var stage=document.getElementById('stage');
var title=document.getElementById('scene-title');
var desc=document.getElementById('scene-desc');
var pause=document.getElementById('pause');
var playing=true;
var active='harpoon';
function display(name){
 if(!lib||!lib.names[name])return;
 active=name;
 stage.innerHTML=lib.html(name);
 // DOM 교체는 모든 CSS 키프레임을 처음부터 다시 시작시키므로 재생 동작을 보장합니다.
 stage.querySelector('.pallid-cine-v2').style.animationPlayState='running';
 stage.classList.toggle('is-paused',!playing);
 stage.style.setProperty('--preview-animation-state',playing?'running':'paused');
 title.textContent=lib.names[name][0];
 desc.textContent=lib.names[name][1];
 document.querySelectorAll('#scene-tabs [data-scene]').forEach(function(b){
  b.setAttribute('aria-pressed',String(b.getAttribute('data-scene')===name));
 });
}
document.getElementById('scene-tabs').addEventListener('click',function(event){
 var button=event.target.closest('button[data-scene]');
 if(button)display(button.getAttribute('data-scene'));
});
document.getElementById('replay').addEventListener('click',function(){if(window.PallidCinematicV3)window.PallidCinematicV3.replayToken=(window.PallidCinematicV3.replayToken||0)+1;playing=true;pause.textContent='일시 정지';pause.setAttribute('aria-pressed','false');display(active)});
pause.addEventListener('click',function(){
 playing=!playing;
 stage.classList.toggle('is-paused',!playing);
 stage.style.setProperty('--preview-animation-state',playing?'running':'paused');
 pause.textContent=playing?'일시 정지':'계속 재생';
 pause.setAttribute('aria-pressed',String(!playing));
});
if(!lib){
 stage.innerHTML='<div class="load-error">애니메이션 파일을 불러오지 못했습니다. 페이지를 새로고침해 주세요.</div>';
}else display(active);
})();
</script>
<style>#stage.is-paused .pallid-cine-v2 svg *,#stage.is-paused .pallid-cine-v2 svg {animation-play-state:paused!important}</style>
</body>
</html>
